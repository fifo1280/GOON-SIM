<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gooning Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        
        .click-emoji {
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 15px 25px rgba(168, 85, 247, 0.3));
        }
        .click-emoji:active {
            transform: scale(0.82) rotate(-3deg);
        }
        
        .float-text {
            position: absolute;
            pointer-events: none;
            font-weight: 800;
            font-size: 1.5rem;
            color: #facc15;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
        }

        .milestone-banner {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            animation: popText 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
            width: 90%;
        }
        @keyframes popText {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 90;
            animation: explode 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

    <!-- Horní Lišta -->
    <header class="bg-slate-900 border-b border-slate-800 py-3 px-6 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <span class="text-2xl" id="header-emoji">🗿</span>
            <h1 class="font-black text-xl bg-gradient-to-r from-purple-400 to-amber-300 bg-clip-text text-transparent">Gooning Simulator</h1>
        </div>
        <div class="text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 text-slate-300">
            🟢 Online Mód (GitHub Synchronizace)
        </div>
    </header>

    <!-- Hlavní Mřížka -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12">
        
        <!-- LEVÝ SLOUPEC: Klikací Zóna -->
        <section class="lg:col-span-5 border-b lg:border-b-0 lg:border-r border-slate-800 p-6 flex flex-col items-center justify-center relative min-h-[380px] bg-gradient-to-b from-slate-950 via-purple-950/10 to-slate-950">
            
            <!-- Statistiky -->
            <div class="text-center mb-6 z-10">
                <div class="text-sm uppercase tracking-wider text-slate-400 font-semibold mb-1" id="currency-label">Goon Coins</div>
                <div class="text-5xl font-black text-amber-400 tracking-tight drop-shadow-md" id="score-val">0</div>
                <div class="text-sm font-medium text-purple-400 mt-2 bg-purple-950/40 px-4 py-1 rounded-full border border-purple-800/40 inline-block" id="cps-val">+0 / sekundu</div>
                <div class="text-xs text-slate-500 mt-2">Celkem naklikáno: <span id="clicks-val" class="font-bold text-slate-400">0</span></div>
            </div>

            <!-- Tlačítko -->
            <button id="main-click-btn" class="click-emoji text-8xl md:text-9xl my-4 focus:outline-none cursor-pointer">🗿</button>

        </section>

        <!-- PROSTŘEDNÍ SLOUPEC: Obchod s upgrady -->
        <section class="lg:col-span-4 border-b lg:border-b-0 lg:border-r border-slate-800 p-6 bg-slate-900/60 overflow-y-auto">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                <span>🛒</span> Vylepšení & Obchod
            </h2>
            <div id="shop-list" class="space-y-3">
                <!-- Upgrady JS -->
            </div>
        </section>

        <!-- PRAVÝ SLOUPEC: Online Žebříček -->
        <section class="lg:col-span-3 p-6 bg-slate-950 flex flex-col">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                <span>🏆</span> Online Žebříček
            </h2>

            <!-- Formulář pro zápis do žebříčku -->
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mb-4 space-y-3 shadow-md">
                <label class="block text-xs text-slate-400">Tvoje Přezdívka:</label>
                <input type="text" id="player-nick" placeholder="Zadej jméno..." maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-purple-500 outline-none">
                <button id="save-score-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-3 rounded-lg text-xs uppercase tracking-wider transition shadow-md">
                    Uložit mé skóre
                </button>
            </div>

            <!-- Tabulka TOP Hráčů -->
            <div class="flex-1 overflow-y-auto pr-1">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-800 pb-1">
                            <th class="py-2">#</th>
                            <th class="py-2">Hráč</th>
                            <th class="py-2 text-right">Měna</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="3" class="py-4 text-center text-slate-500">Načítám online žebříček...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- FIREBASE FIRESTORE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurace z prostředí nebo výchozí fallback
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyDemoConfigKeyForTestingOnly",
                authDomain: "gooning-sim.firebaseapp.com",
                projectId: "gooning-sim",
                storageBucket: "gooning-sim.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef123456"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gooning-sim-v1';
        
        let app, db, auth, currentUser = null;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Autentizace
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    listenToLeaderboard();
                }
            });
        } catch (err) {
            console.warn("Firebase nepřípojen (lokální režim):", err);
        }

        // Cesta k veřejnému žebříčku podle pravidla Rule 1
        function getLeaderboardRef() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
        }

        // Načítání Žebříčku v reálném čase
        function listenToLeaderboard() {
            if (!db || !currentUser) return;
            
            try {
                // RULE 2: Žádné složité query, řazení v paměti JS
                onSnapshot(getLeaderboardRef(), (snapshot) => {
                    const players = [];
                    snapshot.forEach(doc => {
                        players.push({ id: doc.id, ...doc.data() });
                    });

                    // Seřazení podle skóre v JS
                    players.sort((a, b) => (b.coins || 0) - (a.coins || 0));

                    renderLeaderboardUI(players.slice(0, 15));
                }, (error) => {
                    console.error("Chyba při načítání žebříčku:", error);
                });
            } catch (e) {
                console.error(e);
            }
        }

        // Odeslání skóre
        window.submitOnlineScore = async function(nickname, coins, clicks) {
            if (!db || !currentUser) {
                alert("Online databáze není dostupná.");
                return;
            }
            try {
                const playerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);
                await setDoc(playerDocRef, {
                    nick: nickname || 'Anonym',
                    coins: Math.floor(coins),
                    clicks: clicks,
                    updatedAt: Date.now()
                }, { merge: true });
            } catch (err) {
                console.error("Chyba při ukládání skóre:", err);
            }
        };

        function renderLeaderboardUI(players) {
            const body = document.getElementById('leaderboard-body');
            if (!body) return;
            if (players.length === 0) {
                body.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-slate-500">Zatím žádné skóre. Buď první!</td></tr>';
                return;
            }

            body.innerHTML = players.map((p, idx) => {
                const isMe = currentUser && p.id === currentUser.uid;
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1) + '.';
                const rowClass = isMe ? 'bg-purple-950/40 font-bold text-amber-300' : 'text-slate-300';
                return '<tr class="' + rowClass + ' hover:bg-slate-900 transition">' +
                    '<td class="py-2.5 font-semibold">' + medal + '</td>' +
                    '<td class="py-2.5 truncate max-w-[110px]">' + escapeHtml(p.nick || 'Hráč') + '</td>' +
                    '<td class="py-2.5 text-right font-mono text-amber-400">' + Math.floor(p.coins || 0).toLocaleString('cs-CZ') + '</td>' +
                '</tr>';
            }).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

    <!-- HERNÍ LOGIKA -->
    <script>
        const config = {"currency":"Goon Coins","emoji":"🍑","milestone10":{"text":"Výstřik","color":"#ffffff"},"milestone100":{"text":"Fontána","color":"#ffffff"},"upgrades":[{"name":"Automatický Masturbátor","price":15,"cps":1,"clickPower":0},{"name":"Manuální Masturbátor","price":100,"cps":5,"clickPower":1},{"name":"Sliny / olivový olej","price":500,"cps":20,"clickPower":5},{"name":"Lubrinkant","price":2000,"cps":80,"clickPower":15}]};

        let score = 0;
        let totalCps = 0;
        let clickPower = 1;
        let totalClicks = 0;

        // Načtení upgradů z konfigurace
        const upgrades = config.upgrades.map(u => ({
            name: u.name,
            currentPrice: u.price,
            cps: u.cps,
            clickPower: u.clickPower || 0,
            count: 0
        }));

        // UI elementy
        document.getElementById('header-emoji').textContent = config.emoji;
        document.getElementById('main-click-btn').textContent = config.emoji;
        document.getElementById('currency-label').textContent = config.currency;

        const scoreUI = document.getElementById('score-val');
        const cpsUI = document.getElementById('cps-val');
        const clicksUI = document.getElementById('clicks-val');
        const shopUI = document.getElementById('shop-list');

        const fmt = (n) => Math.floor(n).toLocaleString('cs-CZ');

        // Vykreslení obchodu
        function renderShop() {
            shopUI.innerHTML = '';
            upgrades.forEach((u, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-slate-800 hover:bg-slate-700/80 disabled:opacity-40 disabled:hover:bg-slate-800 p-3.5 rounded-xl border border-slate-700/80 text-left transition flex items-center justify-between group';
                btn.id = 'upg-btn-' + i;
                btn.onclick = () => buyUpgrade(i);
                
                let bonusText = [];
                if (u.cps > 0) bonusText.push('+' + fmt(u.cps) + '/s');
                if (u.clickPower > 0) bonusText.push('+' + fmt(u.clickPower) + '/klik');

                btn.innerHTML = '<div>' +
                    '<div class="font-bold text-sm text-white group-hover:text-purple-300 transition">' + u.name + '</div>' +
                    '<div class="text-xs text-purple-400 mt-0.5">' + bonusText.join(' | ') + '</div>' +
                '</div>' +
                '<div class="text-right">' +
                    '<div class="font-black text-amber-400 text-sm" id="upg-price-' + i + '">' + fmt(u.currentPrice) + '</div>' +
                    '<div class="text-[10px] text-slate-400">Vlastněno: <span id="upg-count-' + i + '" class="font-bold text-slate-200">0</span></div>' +
                '</div>';
                shopUI.appendChild(btn);
            });
        }

        function updateUI() {
            scoreUI.textContent = fmt(score);
            cpsUI.textContent = '+' + fmt(totalCps) + ' ' + config.currency + '/s';
            clicksUI.textContent = fmt(totalClicks);

            upgrades.forEach((u, i) => {
                const btn = document.getElementById('upg-btn-' + i);
                if (btn) {
                    btn.disabled = score < u.currentPrice;
                    document.getElementById('upg-price-' + i).textContent = fmt(u.currentPrice);
                    document.getElementById('upg-count-' + i).textContent = u.count;
                }
            });
        }

        function buyUpgrade(idx) {
            const u = upgrades[idx];
            if (score >= u.currentPrice) {
                score -= u.currentPrice;
                totalCps += u.cps;
                clickPower += u.clickPower;
                u.count++;
                u.currentPrice = Math.ceil(u.currentPrice * 1.15);
                updateUI();
            }
        }

        // Efekty explozí
        function triggerExplosion(milestoneConfig, particleCount) {
            const { text, color } = milestoneConfig;

            // Zobrazení velkého textu
            const banner = document.createElement('div');
            banner.className = 'milestone-banner';
            banner.textContent = text;
            banner.style.color = color;
            document.body.appendChild(banner);
            setTimeout(() => banner.remove(), 2600);

            // Generování částic
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = color;
                p.style.boxShadow = '0 0 12px ' + color;

                const size = 6 + Math.random() * 16;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = centerX + 'px';
                p.style.top = centerY + 'px';

                const angle = Math.random() * Math.PI * 2;
                const dist = 120 + Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.8;

                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

        // Klikací akce
        document.getElementById('main-click-btn').addEventListener('click', (e) => {
            score += clickPower;
            totalClicks++;

            // Létající číslice
            const floatEl = document.createElement('div');
            floatEl.className = 'float-text';
            floatEl.textContent = '+' + fmt(clickPower);

            const rect = e.target.getBoundingClientRect();
            const x = e.clientX || (rect.left + rect.width / 2);
            const y = e.clientY || (rect.top + rect.height / 2);

            floatEl.style.left = (x - 15) + 'px';
            floatEl.style.top = (y - 25) + 'px';

            document.body.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 800);

            // Kontrola milníků
            if (totalClicks === 10) {
                triggerExplosion(config.milestone10, 60);
            } else if (totalClicks === 100) {
                triggerExplosion(config.milestone100, 160);
            }

            updateUI();
        });

        // Automatický zisk za sekundu
        setInterval(() => {
            if (totalCps > 0) {
                score += totalCps;
                updateUI();
            }
        }, 1000);

        // Záchrana přezdívky a odeslání do žebříčku
        const nickInput = document.getElementById('player-nick');
        nickInput.value = localStorage.getItem('goon_nick') || '';

        document.getElementById('save-score-btn').addEventListener('click', () => {
            const nick = nickInput.value.trim() || 'Anonym';
            localStorage.setItem('goon_nick', nick);

            if (window.submitOnlineScore) {
                window.submitOnlineScore(nick, score, totalClicks);
                const btn = document.getElementById('save-score-btn');
                btn.textContent = '✅ Uloženo!';
                setTimeout(() => btn.textContent = 'Uložit mé skóre', 2000);
            }
        });

        // Start
        renderShop();
        updateUI();
    </script>
</body>
</html>
