<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gooning Simulator</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('goon_theme') || 'noc'; } catch (e) {}</script>
    <script>
        // Zástupné funkce: kliknutí během načítání se zapamatuje a provede, jakmile je hra připravená.
        (function () {
            var q = []; window.__q = q;
            ['openModal','closeModal','openProfile','spinWheel','toggleAutoSpin','setTheme','setClickEmoji','saveProfile','uploadAvatar','removeAvatar','adminAct','challenge','sendCoins','duelClick','closeDuel'].forEach(function (n) {
                window[n] = function () { q.push([n, [].slice.call(arguments)]); var b = document.getElementById('status-indicator'); if (b) b.textContent = '⏳ Načítám hru…'; };
            });
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const V = (n) => 'rgb(var(--' + n + ') / <alpha-value>)';
        tailwind.config = { theme: { extend: { colors: {
            slate: { 100: V('t1'), 300: V('t3'), 400: V('t4'), 500: V('t5'), 600: V('b2'), 700: V('b1'), 800: V('c2'), 900: V('c1'), 950: V('bg') },
            amber: { 300: V('a3'), 400: V('a4'), 500: V('a5'), 600: V('a6'), 950: V('a9') },
            purple: { 300: V('p3'), 400: V('p4'), 500: V('p5'), 600: V('p6'), 800: V('p6'), 950: V('p9') }
        } } } };
    </script>
    <style>
        html, body { touch-action: manipulation; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        input { font-size: 16px !important; }
        input, textarea, select { user-select: text; -webkit-user-select: text; }
        @keyframes megaFlash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .click-emoji { transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 15px 25px rgba(168, 85, 247, 0.3)); }
        .click-emoji:active { transform: scale(0.82) rotate(-3deg); }
        .float-text { position: absolute; pointer-events: none; font-weight: 800; font-size: 1.5rem; color: #facc15; text-shadow: 0 2px 8px rgba(0,0,0,0.8); animation: floatUp 0.8s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.4); } }
        .milestone-banner { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 900; text-align: center; z-index: 100; pointer-events: none; animation: popText 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-shadow: 0 0 30px rgba(0,0,0,0.9); width: 90%; }
        @keyframes popText { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); } }
        .particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 90; animation: explode 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
    
        /* ===== MOTIVY (barvy se berou z proměnných) ===== */
        :root, :root[data-theme="noc"], :root[data-theme="light"] #duel-ov {
            --bg:2 6 23; --c1:15 23 42; --c2:30 41 59; --b1:51 65 85; --b2:71 85 105; --t5:100 116 139; --t4:148 163 184; --t3:203 213 225; --t1:241 245 249;
            --a3:252 211 77; --a4:251 191 36; --a5:245 158 11; --a6:217 119 6; --a9:69 26 3;
            --p3:216 180 254; --p4:192 132 252; --p5:168 85 247; --p6:147 51 234; --p9:59 7 100;
        }
        :root[data-theme="neon"] {
            --bg:5 2 20; --c1:15 8 40; --c2:28 16 66; --b1:60 36 120; --b2:90 56 160; --t5:120 100 170; --t4:160 140 210; --t3:200 190 240; --t1:240 235 255;
            --a3:249 168 212; --a4:244 114 182; --a5:236 72 153; --a6:219 39 119; --a9:80 7 36;
            --p3:103 232 249; --p4:34 211 238; --p5:6 182 212; --p6:8 145 178; --p9:8 51 68;
        }
        :root[data-theme="light"] {
            --bg:244 246 251; --c1:255 255 255; --c2:226 232 240; --b1:203 213 225; --b2:148 163 184; --t5:120 133 154; --t4:90 104 128; --t3:55 68 92; --t1:15 23 42;
            --a3:161 98 7; --a4:180 83 9; --a5:245 158 11; --a6:217 119 6; --a9:254 243 199;
            --p3:109 40 217; --p4:126 34 206; --p5:168 85 247; --p6:147 51 234; --p9:237 233 254;
        }
        :root[data-theme="light"] .text-white { color: rgb(var(--t1)); }
        :root[data-theme="light"] #duel-ov .text-white { color: #fff; }
        :root[data-theme="light"] .text-slate-950 { color: #111827; }
        :root[data-theme="light"] .text-slate-900 { color: #0f172a; }
        :root[data-theme="light"] button[class*="bg-red-"], :root[data-theme="light"] button[class*="bg-purple-"],
        :root[data-theme="light"] button[class*="bg-green-"], :root[data-theme="light"] button[class*="bg-sky-"] { color: #fff; }
        :root[data-theme="neon"] #main-click-btn { filter: drop-shadow(0 0 28px rgb(var(--a5) / .8)); }
        :root[data-theme="neon"] h1 { text-shadow: 0 0 18px rgb(var(--p5) / .6); }

        /* ===== VYLEPŠENÍ VZHLEDU ===== */
        header { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(10px); }
        nav button { transition: transform .12s, filter .12s; box-shadow: 0 2px 8px rgb(0 0 0 / .25); }
        nav button:hover { transform: translateY(-1px); filter: brightness(1.12); }
        #shop-list button { transition: transform .12s, border-color .12s, box-shadow .12s; }
        #shop-list button:not(:disabled) { border-color: rgb(var(--a5) / .45); }
        #shop-list button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgb(0 0 0 / .25); }
        #score-val { font-variant-numeric: tabular-nums; text-shadow: 0 0 24px rgb(var(--a5) / .35); }
        .click-emoji:hover:not(:active) { transform: scale(1.06); }
        #modal > div, #duel-invite { box-shadow: 0 20px 60px rgb(0 0 0 / .5); animation: uiPop .18s ease-out; }
        @keyframes uiPop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        main > section { scrollbar-width: thin; }
        @media (min-width: 1024px) { main { align-items: stretch; } }
        @media (min-width: 1024px) {
            html body { height: 100vh; overflow: hidden; }
            main { min-height: 0; }
            main > section { overflow-y: auto; }
        }

        /* ===== NAVIGACE: spodní lišta na mobilu, panel pod hlavičkou na PC ===== */
        .nav-btn { --acc: rgb(var(--p5)); flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: .5rem .25rem .45rem;
            font-size: .65rem; font-weight: 700; color: rgb(var(--t4)); background: transparent; border: 0; border-top: 2px solid transparent; box-shadow: none; transition: color .15s, background .15s, border-color .15s; }
        .nav-btn .ico { font-size: 1.4rem; line-height: 1; }
        .nav-btn:hover, .nav-btn:active { color: rgb(var(--t1)); background: rgb(var(--c2) / .7); border-top-color: var(--acc); transform: none; filter: none; }
        .nav-btn.hidden { display: none; }
        #main-nav { padding-bottom: env(safe-area-inset-bottom); }
        .card { background: rgb(var(--c1) / .85); border: 1px solid rgb(var(--b1) / .7); border-radius: 1rem; }
        .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .3rem .75rem; border-radius: 9999px; font-size: .75rem; font-weight: 700; background: rgb(var(--c2) / .8); border: 1px solid rgb(var(--b1) / .7); }
        .sec-title { display: flex; align-items: center; gap: .5rem; font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgb(var(--t4)); margin-bottom: .75rem; }
        #click-halo { background: radial-gradient(circle, rgb(var(--p5) / .22) 0%, rgb(var(--p5) / .06) 45%, transparent 70%); }
        @media (min-width: 1024px) {
            #main-nav { position: static; display: flex; justify-content: center; gap: .6rem; padding: .55rem 1rem; background: rgb(var(--c1) / .6); border-bottom: 1px solid rgb(var(--b1) / .6); }
            .nav-btn { flex: none; flex-direction: row; gap: .5rem; padding: .5rem 1.1rem; font-size: .8rem; border: 1px solid rgb(var(--b1)); border-radius: .75rem; background: rgb(var(--c2) / .6); color: rgb(var(--t3)); }
            .nav-btn .ico { font-size: 1.05rem; }
            .nav-btn:hover { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
            .nav-btn.admin { margin-left: auto; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden pb-[4.5rem] lg:pb-0">

    <header class="bg-slate-900 border-b border-slate-800 py-2.5 px-4 sm:px-6 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
            <span class="text-2xl" id="header-emoji">🗿</span>
            <h1 class="font-black text-base sm:text-xl whitespace-nowrap bg-gradient-to-r from-purple-400 to-amber-300 bg-clip-text text-transparent">Gooning Simulator</h1>
        </div>
        <div class="text-[11px] bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 text-slate-300 max-w-[45%] truncate" id="status-badge">
            <span id="status-indicator">🟡 Připojuji se...</span>
        </div>
    </header>

    <nav id="main-nav" class="fixed bottom-0 inset-x-0 z-40 flex bg-slate-900/95 border-t border-slate-800 backdrop-blur lg:border-t-0">
        <button class="nav-btn" style="--acc:#ef4444" onclick="openModal('duel')"><span class="ico">⚔️</span><span>Souboj</span></button>
        <button class="nav-btn" style="--acc:#a855f7" onclick="openModal('wheel')"><span class="ico">🎡</span><span>Kolo štěstí</span></button>
        <button class="nav-btn" style="--acc:#38bdf8" onclick="openModal('profiles')"><span class="ico">👤</span><span>Profily</span></button>
        <button class="nav-btn" style="--acc:#94a3b8" onclick="openModal('settings')"><span class="ico">⚙️</span><span>Nastavení</span></button>
        <button id="admin-btn" class="nav-btn admin hidden" style="--acc:#f59e0b" onclick="openModal('admin')"><span class="ico">🛡️</span><span>Admin</span></button>
    </nav>

    <div id="modal" class="hidden fixed inset-0 z-[200] bg-black/70 flex items-end sm:items-center justify-center sm:p-4" onclick="if(event.target===this)closeModal()">
        <div class="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-md max-h-[88vh] overflow-y-auto p-5">
            <div class="flex justify-between items-center mb-3"><h3 id="modal-title" class="font-bold text-lg"></h3><button onclick="closeModal()" class="text-slate-400 text-xl px-2">✕</button></div>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="duel-invite" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[250] bg-slate-900 border border-amber-500 rounded-xl p-4 w-[90%] max-w-sm text-center shadow-2xl">
        <div id="duel-invite-text" class="text-sm mb-3"></div>
        <div class="flex gap-2"><button id="inv-yes" class="flex-1 bg-green-600 py-2 rounded-lg text-sm font-bold">Přijmout</button><button id="inv-no" class="flex-1 bg-red-700 py-2 rounded-lg text-sm font-bold">Odmítnout</button></div>
    </div>

    <div id="duel-ov" class="hidden fixed inset-0 z-[300] bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center">
        <div id="duel-title" class="text-2xl font-black mb-3"></div>
        <div id="duel-cards" class="w-full max-w-sm grid grid-cols-2 gap-2 mb-4 text-xs"></div>
        <div class="w-full max-w-sm space-y-3 mb-6">
            <div><div class="text-xs flex justify-between mb-1"><span>Ty</span><span id="duel-me-c"></span></div><div class="h-3 bg-slate-800 rounded"><div id="duel-me-b" class="h-3 bg-amber-400 rounded" style="width:0"></div></div></div>
            <div><div class="text-xs flex justify-between mb-1"><span id="duel-opp-n"></span><span id="duel-opp-c"></span></div><div class="h-3 bg-slate-800 rounded"><div id="duel-opp-b" class="h-3 bg-red-500 rounded" style="width:0"></div></div></div>
        </div>
        <button id="duel-btn" onclick="duelClick(event)" class="click-emoji text-7xl focus:outline-none">🍑</button>
        <div id="duel-msg" class="mt-4 text-sm text-slate-300"></div>
        <button id="duel-close" onclick="closeDuel()" class="hidden mt-4 bg-slate-700 px-4 py-2 rounded-lg text-sm">Zavřít</button>
    </div>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-3 sm:p-4">

        <!-- KLIKÁNÍ -->
        <section class="lg:col-span-4 card p-5 flex flex-col items-center justify-center relative min-h-[360px]">
            <div class="text-center z-10 w-full">
                <div class="text-[11px] uppercase tracking-[.2em] text-slate-400 font-bold" id="currency-label">Goon Coins</div>
                <div class="text-5xl sm:text-6xl font-black text-amber-400 tracking-tight my-1" id="score-val">0</div>
                <div class="flex flex-wrap justify-center gap-2 mt-3">
                    <span class="chip text-purple-400" id="cps-val">+0 / s</span>
                    <span class="chip text-amber-300" id="power-val">+1 / klik</span>
                    <span class="chip text-slate-300">👆 <span id="clicks-val">0</span></span>
                </div>
            </div>
            <div id="click-halo" class="rounded-full p-6 sm:p-8 my-3">
                <button id="main-click-btn" class="click-emoji text-8xl sm:text-9xl block focus:outline-none cursor-pointer">🗿</button>
            </div>
        </section>

        <!-- OBCHOD -->
        <section class="lg:col-span-5 card p-4 sm:p-5 min-h-0">
            <div class="sec-title"><span>🛒</span> Obchod</div>
            <!-- ŠABLONA: LIMITOVANÝ DROP (obsah se plní z JS, viz limitedDrops) -->
            <div id="drop-box" class="mb-4 rounded-xl border border-amber-500/40 bg-gradient-to-r from-amber-950/40 to-purple-950/40 p-3.5">
                <div class="flex items-center justify-between text-[11px] uppercase tracking-wider text-amber-300 font-bold">
                    <span>⚡ Limitovaný drop</span>
                    <span id="drop-timer">--:--</span>
                </div>
                <div id="drop-body" class="mt-2 text-xs text-slate-400">Čekám na další drop...</div>
            </div>
            <div class="sec-title !mb-2 mt-1"><span>⬆️</span> Vylepšení</div>
            <div id="shop-list" class="space-y-2.5"></div>
        </section>

        <!-- ÚČET + ŽEBŘÍČEK -->
        <section class="lg:col-span-3 flex flex-col gap-4 min-h-0">
            <div class="card p-4 space-y-2.5">
                <div class="sec-title !mb-1"><span>👤</span> Můj účet</div>
                <input type="text" id="player-nick" placeholder="Tvoje přezdívka…" maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-purple-500 outline-none select-text">
                <button id="save-score-btn" onclick="window.saveGameProgress && window.saveGameProgress(true)" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-3 rounded-lg text-xs uppercase tracking-wider transition active:scale-95">💾 Uložit pozici & skóre</button>
                <button id="google-btn" onclick="window.googleLogin && window.googleLogin()" class="w-full bg-white hover:bg-slate-200 text-slate-900 font-bold py-2 px-3 rounded-lg text-xs transition active:scale-95">🔐 Přihlásit přes Google</button>
                <button id="logout-btn" onclick="window.googleLogout && window.googleLogout()" class="hidden w-full bg-slate-700 hover:bg-slate-600 text-white py-2 px-3 rounded-lg text-xs transition">Odhlásit</button>
            </div>

            <div class="card p-4 flex-1 min-h-0 flex flex-col">
                <div class="sec-title"><span>🏆</span> Žebříček</div>
                <div class="flex-1 overflow-y-auto pr-1 -mr-1 max-h-[420px] lg:max-h-none">
                    <table class="w-full text-left text-xs">
                        <thead><tr class="text-slate-500 border-b border-slate-800"><th class="py-2">#</th><th class="py-2">Hráč</th><th class="py-2 text-right">Měna</th></tr></thead>
                        <tbody id="leaderboard-body" class="divide-y divide-slate-800/60">
                            <tr><td colspan="3" class="py-4 text-center text-slate-500">Načítám žebříček...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- FIREBASE -->
    <script type="module">
        // Firebase se načítá dynamicky: i když se nenačte (výpadek, blokace), zbytek hry a menu funguje.
        const FB = 'https://www.gstatic.com/firebasejs/11.6.1/';
        let fb = {};
        try {
            const mods = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
            fb = Object.assign({}, mods[0], mods[1], mods[2]);
        } catch (e) { console.error('Firebase se nenačetl:', e); }
        const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, linkWithPopup, linkWithRedirect, signInWithRedirect, getRedirectResult, signInWithCredential, signOut,
            getFirestore, collection, doc, setDoc, getDoc, onSnapshot, runTransaction, deleteDoc, increment, query, where, updateDoc, serverTimestamp, getDocFromServer } = fb;

        const firebaseConfig = {
            apiKey: "AIzaSyBlsK8qClnYEyKco0Z2TZ83kuDpSrB4B8g",
            authDomain: "goon-sim.firebaseapp.com",
            projectId: "goon-sim",
            storageBucket: "goon-sim.firebasestorage.app",
            messagingSenderId: "627803499063",
            appId: "1:627803499063:web:b0b19c9da4e837dc10adb2",
            measurementId: "G-9FEPHLHVWB"
        };
        const APP_ID = 'gooning-sim-v1';

        const $ = (id) => document.getElementById(id);
        const setStatus = (t) => { $('status-indicator').textContent = t; };

        let db, auth, currentUser = null, unsubLb = null, loaded = false;

        const lbCol = () => collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaderboard');
        const lbDoc = () => doc(db, 'artifacts', APP_ID, 'public', 'data', 'leaderboard', currentUser.uid);
        const saveDoc = () => doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'saves', 'current');

        const localKey = () => 'goon_game_save_' + (currentUser ? currentUser.uid : 'local');
        function readLocal() {
            try { return JSON.parse(localStorage.getItem(localKey())); } catch (e) { return null; }
        }
        function buildState() {
            return {
                nick: $('player-nick').value.trim() || 'Anonym',
                coins: Math.floor(window.gameScore || 0),
                clicks: window.gameClicks || 0,
                upgrades: window.gameUpgradesState || [],
                limited: window.gameLimited || { owned: {}, slot: 0, slotBought: 0 },
                meta: window.gameMeta || {},
                updatedAt: Date.now()
            };
        }
        function isEmptyState() { return !(window.gameScore > 0) && !(window.gameClicks > 0); }
        function saveLocal(force) {
            if (isEmptyState() && !force) return;
            try { localStorage.setItem(localKey(), JSON.stringify(buildState())); } catch (e) {}
        }

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            } catch (err) {
                console.error(err);
                setStatus('⚠️ Pouze lokální paměť');
                useLocalOnly();
                return;
            }

            // Výsledek přesměrování z Google (mobil)
            try {
                await getRedirectResult(auth);
            } catch (err) {
                if (err.code === 'auth/credential-already-in-use' || err.code === 'auth/email-already-in-use') {
                    const cred = GoogleAuthProvider.credentialFromError(err);
                    try { if (cred) await signInWithCredential(auth, cred); } catch (e) { console.error(e); }
                } else {
                    console.error('Redirect chyba:', err);
                }
            }

            // Listener se registruje PŘED přihlášením
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    try { await signInAnonymously(auth); }
                    catch (err) {
                        console.error('Auth chyba:', err);
                        const hint = err.code === 'auth/operation-not-allowed' ? 'Zapni Anonymous v Firebase Auth' :
                                     err.code === 'auth/unauthorized-domain' ? 'Doména není povolená ve Firebase Auth' : err.code;
                        setStatus('⚠️ Přihlášení selhalo: ' + hint);
                        useLocalOnly();
                    }
                    return;
                }
                currentUser = user;
                const isGoogle = !user.isAnonymous;
                setStatus(isGoogle ? '🟢 ' + (user.displayName || user.email || 'Google účet') : '🟢 Cloud aktivní (anonymní účet)');
                $('google-btn').classList.toggle('hidden', isGoogle);
                $('logout-btn').classList.toggle('hidden', !isGoogle);
                listenToLeaderboard();
                await loadCloudProgress();
                startFeatures();
            });
        }

        function useLocalOnly() {
            const local = readLocal();
            if (local && !loaded) window.applyLoadedData(local);
            loaded = true;
            renderLeaderboardUI([], 'Žebříček vyžaduje připojení ke cloudu.');
        }

        function listenToLeaderboard() {
            if (unsubLb) unsubLb();
            unsubLb = onSnapshot(lbCol(), (snap) => {
                const players = [];
                snap.forEach(d => players.push({ id: d.id, ...d.data() }));
                players.sort((a, b) => (b.coins || 0) - (a.coins || 0));
                allPlayers = players;
                renderLeaderboardUI(players.slice(0, 15));
                if (window.onPlayers) window.onPlayers();
            }, (error) => {

                    // Propojí anonymní účet s Googlem – postup zůstane zachován
                    await linkWithPopup(auth.currentUser, provider);

                if (err.code === 'auth/credential-already-in-use' || err.code === 'auth/email-already-in-use') {
                    // Google účet už existuje -> přihlásit se do něj bez druhého popupu
                    const cred = GoogleAuthProvider.credentialFromError(err);
                    try {

        // ---------- SYNCHRONIZACE HODIN SE SERVEREM ----------

        let score = 0, totalCps = 0, clickPower = 1, totalClicks = 0;

        // ===== KOLO ŠTĚSTÍ =====

        window.WHEEL = WHEEL; window.limitedDrops = limitedDrops;

        const upgrades = config.upgrades.map(u => ({
            name: u.name, basePrice: u.price, currentPrice: u.price,
            cps: u.cps, clickPower: u.clickPower || 0, count: 0
        }));

        function syncGlobalState() {
            window.gameScore = score;
            window.gameClicks = totalClicks;
            window.gameCps = totalCps;
            window.gameClickPower = clickPower;
            window.gameLimited = limited;
            window.gameMeta = meta;
            window.gameUpgradesState = upgrades.map(u => ({ count: u.count, currentPrice: u.currentPrice }));
        }

        window.applyLoadedData = function (data) {
            if (!data) return;
            score = Number(data.coins) || 0;
            totalClicks = Number(data.clicks) || 0;

            if (data.nick && data.nick !== 'Anonym') {
                const nickInput = document.getElementById('player-nick');
                if (nickInput) nickInput.value = data.nick;
            }

            if (Array.isArray(data.upgrades)) {
                data.upgrades.forEach((s, idx) => {
                    if (upgrades[idx]) {
                        upgrades[idx].count = s.count || 0;
                        upgrades[idx].currentPrice = s.currentPrice || Math.ceil(upgrades[idx].basePrice * Math.pow(1.15, upgrades[idx].count));
                    }
                });
            }

            totalCps = 0;
            clickPower = 1;
            if (data.meta) Object.assign(meta, data.meta);
            if (data.meta && data.meta.theme) applyTheme(data.meta.theme);
            applyEmoji();
            if (data.limited && data.limited.owned) {
                limited = { owned: data.limited.owned, slot: data.limited.slot || 0, slotBought: data.limited.slotBought || 0 };
            }
            upgrades.forEach(u => { totalCps += u.count * u.cps; clickPower += u.count * u.clickPower; });
            limitedDrops.forEach(d => { const c = limited.owned[d.id] || 0; totalCps += c * d.cps; clickPower += c * d.clickPower; });

            // Offline výdělek (1 % CPS za sekundu, max 24 h)
            if (data.updatedAt && totalCps > 0) {
                const secondsOffline = Math.floor((Date.now() - data.updatedAt) / 1000);
                if (secondsOffline >= 30) {
                    const secs = Math.min(secondsOffline, 86400);
                    const earned = Math.floor(secs * totalCps * 0.01);
                    if (earned > 0) {
                        score += earned;
                        setTimeout(() => {
                            const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
                            let t = (h > 0 ? h + 'h ' : '') + (m > 0 ? m + 'm ' : '') + s + 's';
                            alert('🌙 Vítej zpět!\n\nBěhem tvé nepřítomnosti (' + t + ') ses vydělalo:\n+' + abbr(earned) + ' ' + config.currency + '!');
                        }, 600);
                    }
                }
            }
            syncGlobalState();
            updateUI();
        };

        ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
            document.addEventListener(ev, (e) => e.preventDefault()));

        function applyEmoji() {
            ['header-emoji', 'main-click-btn', 'duel-btn'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = meta.emoji; });
        }
        window.applyEmoji = applyEmoji;
        function applyTheme(t) {
            if (['noc', 'neon', 'light'].indexOf(t) < 0) t = 'noc';
            meta.theme = t; document.documentElement.dataset.theme = t;
            try { localStorage.setItem('goon_theme', t); } catch (e) {}
        }
        window.applyTheme = applyTheme;
        applyEmoji();
        document.getElementById('currency-label').textContent = config.currency;

        const scoreUI = document.getElementById('score-val');
        const cpsUI = document.getElementById('cps-val');
        const clicksUI = document.getElementById('clicks-val');
        const shopUI = document.getElementById('shop-list');
        // Zkrácení velkých čísel: 1 500 000 -> "1,5 mil.", 30 000 000 000 -> "30 mld."
        const UNITS = [[1e18, 'trl.'], [1e15, 'bld.'], [1e12, 'bil.'], [1e9, 'mld.'], [1e6, 'mil.']];
        function abbr(n) {
            n = Math.floor(n || 0);
            if (!isFinite(n)) return '∞';
            for (const [v, u] of UNITS) {
                if (n >= v) {
                    const x = n / v;
                    let t = x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
                    if (t.includes('.')) t = t.replace(/\.?0+$/, '');
                    return t.replace('.', ',') + ' ' + u;
                }
            }
            return n.toLocaleString('cs-CZ');
        }
        window.abbr = abbr;
        const fmt = abbr;

        function renderShop() {
            shopUI.innerHTML = '';
            upgrades.forEach((u, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-slate-800 hover:bg-slate-700/80 disabled:opacity-40 disabled:hover:bg-slate-800 p-3.5 rounded-xl border border-slate-700/80 text-left transition flex items-center justify-between group cursor-pointer';
                btn.id = 'upg-btn-' + i;
                btn.onclick = () => buyUpgrade(i);
                const bonus = [];
                if (u.cps > 0) bonus.push('+' + fmt(u.cps) + '/s');
                if (u.clickPower > 0) bonus.push('+' + fmt(u.clickPower) + '/klik');
                btn.innerHTML = '<div><div class="font-bold text-sm text-white group-hover:text-purple-300 transition">' + u.name + '</div>' +
                    '<div class="text-xs text-purple-400 mt-0.5">' + bonus.join(' | ') + '</div></div>' +
                    '<div class="text-right"><div class="font-black text-amber-400 text-sm" id="upg-price-' + i + '">' + fmt(u.currentPrice) + '</div>' +
                    '<div class="text-[10px] text-slate-400">Vlastněno: <span id="upg-count-' + i + '" class="font-bold text-slate-300">0</span></div></div>';
                shopUI.appendChild(btn);
            });
        }

        function updateUI() {
            scoreUI.textContent = fmt(score); scoreUI.title = Math.floor(score).toLocaleString('cs-CZ');
            cpsUI.textContent = '+' + fmt(totalCps) + ' / s';
            const pw = document.getElementById('power-val'); if (pw) pw.textContent = '+' + fmt(clickPower) + ' / klik';
            clicksUI.textContent = fmt(totalClicks);
            if (typeof refreshDrop === 'function') refreshDrop();
            upgrades.forEach((u, i) => {
                const btn = document.getElementById('upg-btn-' + i);
                if (btn) {
                    btn.disabled = score < u.currentPrice;
                    document.getElementById('upg-price-' + i).textContent = fmt(u.currentPrice);
                    document.getElementById('upg-count-' + i).textContent = u.count;
                }
            });
        }

        function buyUpgrade(idx) {
            const u = upgrades[idx];
            if (score >= u.currentPrice) {
                score -= u.currentPrice;
                totalCps += u.cps;
                clickPower += u.clickPower;
                u.count++;
                u.currentPrice = Math.ceil(u.currentPrice * 1.15);
                syncGlobalState();
                updateUI();
            }
        }

        function triggerExplosion(m, particleCount) {
            const banner = document.createElement('div');
            banner.className = 'milestone-banner';
            banner.textContent = m.text;
            banner.style.color = m.color;
            document.body.appendChild(banner);
            setTimeout(() => banner.remove(), 2600);

            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = m.color;
                p.style.boxShadow = '0 0 12px ' + m.color;
                const size = 6 + Math.random() * 16;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                const angle = Math.random() * Math.PI * 2;
                const dist = 120 + Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.8;
                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

        document.getElementById('main-click-btn').addEventListener('click', (e) => {
            mainDet(e);
            score += clickPower;
            totalClicks++;

            const floatEl = document.createElement('div');
            floatEl.className = 'float-text';

            const rect = e.currentTarget.getBoundingClientRect();

            else if (totalClicks === 100) triggerExplosion(config.milestone100, 160);

            syncGlobalState();
            updateUI();

        setInterval(() => {
            if (totalCps > 0) { score += totalCps; syncGlobalState(); updateUI(); }
        }, 1000);

        // ===== OBROVSKÁ BÍLÁ EXPLOZE (konec souboje) =====
        function megaExplosion() {
            const flash = document.createElement('div');
            flash.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:500;pointer-events:none;animation:megaFlash 1.8s ease-out forwards';
            document.body.appendChild(flash); setTimeout(() => flash.remove(), 1900);
            const cx = window.innerWidth / 2, cy = window.innerHeight / 2, R = Math.max(window.innerWidth, window.innerHeight);
            for (let i = 0; i < 350; i++) {
                const p = document.createElement('div'), size = 10 + Math.random() * 40, a = Math.random() * Math.PI * 2, d = 150 + Math.random() * R;
                p.className = 'particle';
                p.style.cssText = 'z-index:550;background:#fff;box-shadow:0 0 25px #fff,0 0 60px #fff;animation-duration:1.8s;width:' + size + 'px;height:' + size + 'px;left:' + cx + 'px;top:' + cy + 'px;';

                document.body.appendChild(p); setTimeout(() => p.remove(), 1900);
            }
        }
        window.megaExplosion = megaExplosion;

        // ===== TOAST + HERNÍ API PRO MODUL =====
        function showToast(text, ms) {
            const t = document.createElement('div');
            t.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[400] bg-red-700/95 text-white text-sm font-bold px-4 py-2 rounded-xl shadow-2xl max-w-[90%] text-center';
            t.style.color = '#fff'; t.textContent = text; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 4000);
        }
        function recalcTotals() {
            totalCps = 0; clickPower = 1;
            upgrades.forEach(u => { totalCps += u.count * u.cps; clickPower += u.count * u.clickPower; });
            limitedDrops.forEach(d => { const c = limited.owned[d.id] || 0; totalCps += c * d.cps; clickPower += c * d.clickPower; });
        }
        window.gameAPI = {
            score: () => score,
            addCoins(n) { score = Math.max(0, score + n); syncGlobalState(); updateUI(); },
            giveDrop(id) { limited.owned[id] = (limited.owned[id] || 0) + 1; recalcTotals(); syncGlobalState(); updateUI(); },
            wipe() {
                this.penalty({ reset: true });
                Object.assign(meta, { avatar: '🗿', font: 'sans', color: '#fbbf24', bio: '', emoji: config.emoji, wins: 0, losses: 0, spins: 0, jackpots: 0, bestKps: 0, bestTime: 0, img: '', joined: Date.now() });
                applyEmoji(); syncGlobalState(); updateUI();
            },
            penalty(p) {
                const c = Math.min(100, Math.max(0, Number(p.coinsPct) || 0)), u = Math.min(100, Math.max(0, Number(p.upgradesPct) || 0));
                if (p.reset) {
                    score = 0; totalClicks = 0; upgrades.forEach(x => { x.count = 0; x.currentPrice = x.basePrice; }); limited = { owned: {}, slot: 0, slotBought: 0 };
                } else {
                    score = Math.floor(score * (1 - c / 100));
                    upgrades.forEach(x => { x.count -= Math.round(x.count * u / 100); x.currentPrice = Math.ceil(x.basePrice * Math.pow(1.15, x.count)); });
                    for (const k in limited.owned) limited.owned[k] -= Math.round(limited.owned[k] * u / 100);
                }
                recalcTotals(); syncGlobalState(); updateUI();
            }
        };

        // Hlídá pravidelnost intervalů mezi kliky. Člověk má odchylku desítky ms, autoclicker jednotky.
        // Ladění: sdMs = max. směrodatná odchylka (ms), cv = max. poměr odchylka/průměr, minSamples = kolik kliků analyzovat.
        const AC = { minSamples: 30, sdMs: 10, cv: 0.03, consecutive: 10 };
        function makeDetector(onFlag) {
            let iv = [], last = 0, sus = 0;
            return function (e) {
                if (!e.isTrusted) { onFlag('Syntetické kliky (isTrusted=false)', {}); return; }
                const now = performance.now();
                if (last && now - last < 2000) { iv.push(now - last); if (iv.length > AC.minSamples + 10) iv.shift(); } else { iv = []; sus = 0; }
                last = now;
                if (iv.length < AC.minSamples) return;
                const m = iv.reduce((a, b) => a + b, 0) / iv.length, sd = Math.sqrt(iv.reduce((a, b) => a + (b - m) * (b - m), 0) / iv.length);
                if (sd < AC.sdMs || sd / m < AC.cv) {
                    if (++sus >= AC.consecutive) { sus = 0; const sample = iv.slice(-8).map(x => x.toFixed(1)).join(', '); iv = []; onFlag('Pravidelné intervaly kliků', { mean: m, sd: sd, sample: sample }); }
                } else sus = 0;
            };
        }
        let acCool = 0;
        function flagAutoclick(reason, info) {
            if (Date.now() < acCool) return; acCool = Date.now() + 60000;
            showToast('⚠️ Detekován autoclicker (' + reason + ')! Admin byl upozorněn.', 6000);
            if (window.reportAutoclicker) window.reportAutoclicker(Object.assign({ reason: reason }, info || {}));
        }
        const mainDet = makeDetector(flagAutoclick);

        // Všichni online vidí stejný drop: odvozuje se z aktuálního času (okno po 10 minutách).
        const byId = (id) => document.getElementById(id);
        const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
        let dropState = { slot: null, def: null, remaining: null, unwatch: null };
        let dropBusy = false;

        const boughtThisSlot = () => (limited.slot === dropState.slot ? limited.slotBought : 0);

        function startDrop(slot) {
            endDrop();
            const def = limitedDrops[slot % limitedDrops.length];
            dropState = { slot, def, remaining: def.stock || null, unwatch: null };
            byId('drop-body').innerHTML =
                '<div class="flex items-center justify-between gap-3">' +
                  '<div class="text-3xl">' + def.emoji + '</div>' +
                  '<div class="flex-1"><div class="font-bold text-sm text-white">' + def.name + '</div>' +
                  '<div class="text-xs text-purple-400">+' + fmt(def.cps) + '/s | +' + fmt(def.clickPower) + '/klik</div>' +
                  '<div class="text-[11px] text-slate-400 mt-0.5" id="drop-stock"></div></div>' +
                  '<button id="drop-buy" onclick="buyDrop()" class="bg-amber-500 hover:bg-amber-400 disabled:opacity-40 disabled:hover:bg-amber-500 text-slate-950 font-black text-xs px-3 py-2 rounded-lg active:scale-95 transition">Koupit<br>' + fmt(def.price) + '</button>' +
                '</div>';
            triggerExplosion({ text: '⚡ NOVÝ DROP!', color: '#fbbf24' }, 40);
            refreshDrop();
        }

        function endDrop() {
            if (dropState.unwatch) { try { dropState.unwatch(); } catch (e) {} }
            dropState = { slot: null, def: null, remaining: null, unwatch: null };
            const b = byId('drop-body');
            if (b) b.textContent = 'Čekám na další drop...';
        }

        function refreshDrop() {
            const def = dropState.def;
            if (!def) return;
            const stockEl = byId('drop-stock'), btn = byId('drop-buy');
            if (!stockEl || !btn) return;
            const mine = boughtThisSlot();
            const soldOut = def.stock > 0 && dropState.remaining === 0;
            stockEl.textContent = (def.stock > 0 ? 'Zbývá: ' + (dropState.remaining === null ? '…' : dropState.remaining) + ' / ' + def.stock : 'Neomezeně') +
                ' | Tvoje: ' + mine + ' / ' + def.maxPerPlayer;
            btn.disabled = dropBusy || soldOut || mine >= def.maxPerPlayer || score < def.price;
            if (soldOut) btn.innerHTML = 'Vyprodáno';
        }

        async function buyDrop() {
            const def = dropState.def;
            if (!def || dropBusy || score < def.price || boughtThisSlot() >= def.maxPerPlayer) return;
            dropBusy = true; refreshDrop();
            try {
                if (def.stock > 0) {
                    const ok = window.buyDropGlobal ? await window.buyDropGlobal(dropState.slot, def.stock) : null;
                    if (ok === false) { dropState.remaining = 0; alert('Vyprodáno! 😢'); return; }
                    if (ok === null) { alert('Nákup se nepovedl (cloud není dostupný). Zkus to za chvíli.'); return; }
                }
                if (score < def.price) return; // mezitím se změnil zůstatek
                score -= def.price;
                limited.owned[def.id] = (limited.owned[def.id] || 0) + 1;
                limited.slot = dropState.slot;
                limited.slotBought = boughtThisSlot() + 1;
                totalCps += def.cps;
                clickPower += def.clickPower;
                syncGlobalState();
                updateUI();
                if (window.saveGameProgress) window.saveGameProgress(false);
            } finally {
                dropBusy = false; refreshDrop();
            }
        }

        function tickDrop() {
            const ms = DROP.intervalMin * 60000, now = Date.now();
            const slot = Math.floor(now / ms), start = slot * ms;
            const active = now - start < DROP.durationSec * 1000;
            const timer = byId('drop-timer');
            if (!active) {
                if (dropState.slot !== null) endDrop();
                timer.textContent = 'další za ' + mmss(start + ms - now);
                return;
            }
            if (dropState.slot !== slot) startDrop(slot);
            timer.textContent = 'zbývá ' + mmss(start + DROP.durationSec * 1000 - now);
            // napojení na globální sklad, jakmile je cloud připravený
            if (dropState.def.stock > 0 && !dropState.unwatch && window.watchDrop) {
                dropState.unwatch = window.watchDrop(slot, (sold) => {
                    dropState.remaining = Math.max(0, dropState.def.stock - sold);
                    refreshDrop();
                });
            }
        }
        setInterval(tickDrop, 1000);
        tickDrop();

        renderShop();
        syncGlobalState();
        updateUI();
    </script>
</body>
</html>
