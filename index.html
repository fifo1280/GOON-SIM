<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gooning Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { touch-action: manipulation; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        input { font-size: 16px !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .click-emoji { transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 15px 25px rgba(168, 85, 247, 0.3)); }
        .click-emoji:active { transform: scale(0.82) rotate(-3deg); }
        .float-text { position: absolute; pointer-events: none; font-weight: 800; font-size: 1.5rem; color: #facc15; text-shadow: 0 2px 8px rgba(0,0,0,0.8); animation: floatUp 0.8s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.4); } }
        .milestone-banner { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 900; text-align: center; z-index: 100; pointer-events: none; animation: popText 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-shadow: 0 0 30px rgba(0,0,0,0.9); width: 90%; }
        @keyframes popText { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); } }
        .particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 90; animation: explode 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

    <header class="bg-slate-900 border-b border-slate-800 py-3 px-6 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <span class="text-2xl" id="header-emoji">🗿</span>
            <h1 class="font-black text-xl bg-gradient-to-r from-purple-400 to-amber-300 bg-clip-text text-transparent">Gooning Simulator</h1>
        </div>
        <div class="text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 text-slate-300 max-w-[60%] truncate" id="status-badge">
            <span id="status-indicator">🟡 Připojuji se...</span>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12">

        <section class="lg:col-span-5 border-b lg:border-b-0 lg:border-r border-slate-800 p-6 flex flex-col items-center justify-center relative min-h-[380px] bg-gradient-to-b from-slate-950 via-purple-950/10 to-slate-950">
            <div class="text-center mb-6 z-10">
                <div class="text-sm uppercase tracking-wider text-slate-400 font-semibold mb-1" id="currency-label">Goon Coins</div>
                <div class="text-5xl font-black text-amber-400 tracking-tight drop-shadow-md" id="score-val">0</div>
                <div class="text-sm font-medium text-purple-400 mt-2 bg-purple-950/40 px-4 py-1 rounded-full border border-purple-800/40 inline-block" id="cps-val">+0 / sekundu</div>
                <div class="text-xs text-slate-500 mt-2">Celkem naklikáno: <span id="clicks-val" class="font-bold text-slate-400">0</span></div>
            </div>
            <button id="main-click-btn" class="click-emoji text-8xl md:text-9xl my-4 focus:outline-none cursor-pointer">🗿</button>
        </section>

        <section class="lg:col-span-4 border-b lg:border-b-0 lg:border-r border-slate-800 p-6 bg-slate-900/60 overflow-y-auto">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2"><span>🛒</span> Vylepšení & Obchod</h2>
            <div id="shop-list" class="space-y-3"></div>
        </section>

        <section class="lg:col-span-3 p-6 bg-slate-950 flex flex-col">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2"><span>🏆</span> Online Žebříček</h2>

            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mb-4 space-y-3 shadow-md">
                <label class="block text-xs text-slate-400">Tvoje Přezdívka:</label>
                <input type="text" id="player-nick" placeholder="Zadej jméno..." maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-purple-500 outline-none select-text">
                <button id="save-score-btn" onclick="window.saveGameProgress && window.saveGameProgress(true)" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-3 rounded-lg text-xs uppercase tracking-wider transition shadow-md active:scale-95">💾 Uložit pozici & skóre</button>
                <button id="google-btn" onclick="window.googleLogin && window.googleLogin()" class="w-full bg-white hover:bg-slate-200 text-slate-900 font-bold py-2 px-3 rounded-lg text-xs transition active:scale-95">🔐 Přihlásit přes Google</button>
                <button id="logout-btn" onclick="window.googleLogout && window.googleLogout()" class="hidden w-full bg-slate-700 hover:bg-slate-600 text-white py-2 px-3 rounded-lg text-xs transition">Odhlásit</button>
            </div>

            <div class="flex-1 overflow-y-auto pr-1">
                <table class="w-full text-left text-xs">
                    <thead><tr class="text-slate-500 border-b border-slate-800"><th class="py-2">#</th><th class="py-2">Hráč</th><th class="py-2 text-right">Měna</th></tr></thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-800/60">
                        <tr><td colspan="3" class="py-4 text-center text-slate-500">Načítám žebříček...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, linkWithPopup, linkWithRedirect, signInWithRedirect, getRedirectResult, signInWithCredential, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlsK8qClnYEyKco0Z2TZ83kuDpSrB4B8g",
            authDomain: "goon-sim.firebaseapp.com",
            projectId: "goon-sim",
            storageBucket: "goon-sim.firebasestorage.app",
            messagingSenderId: "627803499063",
            appId: "1:627803499063:web:b0b19c9da4e837dc10adb2",
            measurementId: "G-9FEPHLHVWB"
        };
        const APP_ID = 'gooning-sim-v1';

        const $ = (id) => document.getElementById(id);
        const setStatus = (t) => { $('status-indicator').textContent = t; };

        let db, auth, currentUser = null, unsubLb = null, loaded = false;

        const lbCol = () => collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaderboard');
        const lbDoc = () => doc(db, 'artifacts', APP_ID, 'public', 'data', 'leaderboard', currentUser.uid);
        const saveDoc = () => doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'saves', 'current');

        const localKey = () => 'goon_game_save_' + (currentUser ? currentUser.uid : 'local');
        function readLocal() {
            try { return JSON.parse(localStorage.getItem(localKey())); } catch (e) { return null; }
        }
        function buildState() {
            return {
                nick: $('player-nick').value.trim() || 'Anonym',
                coins: Math.floor(window.gameScore || 0),
                clicks: window.gameClicks || 0,
                upgrades: window.gameUpgradesState || [],
                updatedAt: Date.now()
            };
        }
        function isEmptyState() { return !(window.gameScore > 0) && !(window.gameClicks > 0); }
        function saveLocal() {
            if (isEmptyState()) return;
            try { localStorage.setItem(localKey(), JSON.stringify(buildState())); } catch (e) {}
        }

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            } catch (err) {
                console.error(err);
                setStatus('⚠️ Pouze lokální paměť');
                useLocalOnly();
                return;
            }

            // Výsledek přesměrování z Google (mobil)
            try {
                await getRedirectResult(auth);
            } catch (err) {
                if (err.code === 'auth/credential-already-in-use' || err.code === 'auth/email-already-in-use') {
                    const cred = GoogleAuthProvider.credentialFromError(err);
                    try { if (cred) await signInWithCredential(auth, cred); } catch (e) { console.error(e); }
                } else {
                    console.error('Redirect chyba:', err);
                }
            }

            // Listener se registruje PŘED přihlášením
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    try { await signInAnonymously(auth); }
                    catch (err) {
                        console.error('Auth chyba:', err);
                        const hint = err.code === 'auth/operation-not-allowed' ? 'Zapni Anonymous v Firebase Auth' :
                                     err.code === 'auth/unauthorized-domain' ? 'Doména není povolená ve Firebase Auth' : err.code;
                        setStatus('⚠️ Přihlášení selhalo: ' + hint);
                        useLocalOnly();
                    }
                    return;
                }
                currentUser = user;
                const isGoogle = !user.isAnonymous;
                setStatus(isGoogle ? '🟢 ' + (user.displayName || user.email || 'Google účet') : '🟢 Cloud aktivní (anonymní účet)');
                $('google-btn').classList.toggle('hidden', isGoogle);
                $('logout-btn').classList.toggle('hidden', !isGoogle);
                listenToLeaderboard();
                await loadCloudProgress();
            });
        }

        function useLocalOnly() {
            const local = readLocal();
            if (local && !loaded) window.applyLoadedData(local);
            loaded = true;
            renderLeaderboardUI([], 'Žebříček vyžaduje připojení ke cloudu.');
        }

        function listenToLeaderboard() {
            if (unsubLb) unsubLb();
            unsubLb = onSnapshot(lbCol(), (snap) => {
                const players = [];
                snap.forEach(d => players.push({ id: d.id, ...d.data() }));
                players.sort((a, b) => (b.coins || 0) - (a.coins || 0));
                renderLeaderboardUI(players.slice(0, 15));
            }, (error) => {
                console.error('Žebříček:', error);
                renderLeaderboardUI([], '⚠️ Žebříček nelze načíst (' + error.code + '). Zkontroluj Firestore pravidla.');
            });
        }

        async function loadCloudProgress() {
            loaded = false;
            let cloud = null, cloudOk = true;
            try {
                const snap = await getDoc(saveDoc());
                if (snap.exists()) cloud = snap.data();
            } catch (err) {
                cloudOk = false;
                console.error('Načtení savu:', err);
                setStatus('⚠️ Cloud save nedostupný (' + err.code + ')');
            }
            // Cloud má přednost; lokální záloha jen když cloud nic nemá nebo je nedostupný
            const best = cloud || readLocal();
            if (best) window.applyLoadedData(best);
            loaded = true;
        }

        window.saveGameProgress = async function (manual) {
            if (!loaded || isEmptyState()) return;
            saveLocal();
            if (!db || !currentUser) return;
            const s = buildState();
            try {
                await setDoc(saveDoc(), s, { merge: true });
                await setDoc(lbDoc(), { nick: s.nick, coins: s.coins, clicks: s.clicks, updatedAt: s.updatedAt }, { merge: true });
                if (manual) {
                    const btn = $('save-score-btn');
                    btn.textContent = '✅ Uloženo do cloudu!';
                    setTimeout(() => btn.textContent = '💾 Uložit pozici & skóre', 2000);
                }
            } catch (err) {
                console.error('Ukládání:', err);
                setStatus('⚠️ Uložení selhalo (' + err.code + ')');
            }
        };

        let loginBusy = false;
        window.googleLogin = async function () {
            if (!auth || loginBusy) return;
            loginBusy = true;
            const provider = new GoogleAuthProvider();
            try {
                if (auth.currentUser && auth.currentUser.isAnonymous) {
                    // Propojí anonymní účet s Googlem – postup zůstane zachován
                    await linkWithPopup(auth.currentUser, provider);
                    location.reload();
                } else {
                    await signInWithPopup(auth, provider);
                }
            } catch (err) {
                if (err.code === 'auth/credential-already-in-use' || err.code === 'auth/email-already-in-use') {
                    // Google účet už existuje -> přihlásit se do něj bez druhého popupu
                    const cred = GoogleAuthProvider.credentialFromError(err);
                    try {
                        await signInWithCredential(auth, cred);
                        location.reload();
                    } catch (e) { alert('Přihlášení selhalo: ' + e.code); }
                } else if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
                    // Mobil: popup je blokovaný -> přesměrování
                    try {
                        await window.saveGameProgress(false);
                        if (auth.currentUser && auth.currentUser.isAnonymous) await linkWithRedirect(auth.currentUser, provider);
                        else await signInWithRedirect(auth, provider);
                    } catch (e) { alert('Přihlášení selhalo: ' + e.code); }
                } else if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                    alert('Přihlášení selhalo: ' + err.code + (err.code === 'auth/unauthorized-domain' ? '\nPřidej doménu do Firebase → Authentication → Settings → Authorized domains.' : ''));
                }
            } finally {
                loginBusy = false;
            }
        };

        window.googleLogout = async function () {
            await window.saveGameProgress(false);
            await signOut(auth);
            location.reload();
        };

        function renderLeaderboardUI(players, msg) {
            const body = $('leaderboard-body');
            if (!players.length) {
                body.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-slate-500">' + escapeHtml(msg || 'Zatím žádné skóre. Buď první!') + '</td></tr>';
                return;
            }
            body.innerHTML = players.map((p, idx) => {
                const isMe = currentUser && p.id === currentUser.uid;
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1) + '.';
                const rowClass = isMe ? 'bg-purple-950/40 font-bold text-amber-300' : 'text-slate-300';
                return '<tr class="' + rowClass + ' hover:bg-slate-900 transition"><td class="py-2.5 font-semibold">' + medal + '</td>' +
                    '<td class="py-2.5 truncate max-w-[110px]">' + escapeHtml(p.nick || 'Hráč') + '</td>' +
                    '<td class="py-2.5 text-right font-mono text-amber-400">' + Math.floor(p.coins || 0).toLocaleString('cs-CZ') + '</td></tr>';
            }).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        setInterval(() => { if (window.saveGameProgress) window.saveGameProgress(false); }, 10000);
        document.addEventListener('visibilitychange', () => { if (document.hidden && loaded) { saveLocal(); window.saveGameProgress(false); } });
        window.addEventListener('pagehide', () => { if (loaded) saveLocal(); });

        initFirebase();
    </script>

    <!-- HERNÍ LOGIKA -->
    <script>
        const config = {"currency":"Goon Coins","emoji":"🍑","milestone10":{"text":"Výstřik","color":"#ffffff"},"milestone100":{"text":"Fontána","color":"#ffffff"},"upgrades":[{"name":"Automatický Masturbátor","price":15,"cps":1,"clickPower":0},{"name":"Manuální Masturbátor","price":100,"cps":5,"clickPower":1},{"name":"Sliny / olivový olej","price":500,"cps":20,"clickPower":5},{"name":"Lubrikant","price":2000,"cps":80,"clickPower":15},{"name":"Lubrikant Durex","price":10000,"cps":150,"clickPower":45},{"name":"Dildo","price":100000,"cps":5000,"clickPower":100},{"name":"Dieslový Masturbátor","price":10000000,"cps":10000,"clickPower":600},{"name":"Kondom s příchutí","price":20000000,"cps":20000,"clickPower":1000},{"name":"Trenky se zipem,","price":30000000,"cps":30000,"clickPower":1500},{"name":"Klec na péro","price":1000000000,"cps":100000,"clickPower":10000}]};

        let score = 0, totalCps = 0, clickPower = 1, totalClicks = 0;

        const upgrades = config.upgrades.map(u => ({
            name: u.name, basePrice: u.price, currentPrice: u.price,
            cps: u.cps, clickPower: u.clickPower || 0, count: 0
        }));

        function syncGlobalState() {
            window.gameScore = score;
            window.gameClicks = totalClicks;
            window.gameCps = totalCps;
            window.gameClickPower = clickPower;
            window.gameUpgradesState = upgrades.map(u => ({ count: u.count, currentPrice: u.currentPrice }));
        }

        window.applyLoadedData = function (data) {
            if (!data) return;
            score = Number(data.coins) || 0;
            totalClicks = Number(data.clicks) || 0;

            if (data.nick && data.nick !== 'Anonym') {
                const nickInput = document.getElementById('player-nick');
                if (nickInput) nickInput.value = data.nick;
            }

            if (Array.isArray(data.upgrades)) {
                data.upgrades.forEach((s, idx) => {
                    if (upgrades[idx]) {
                        upgrades[idx].count = s.count || 0;
                        upgrades[idx].currentPrice = s.currentPrice || Math.ceil(upgrades[idx].basePrice * Math.pow(1.15, upgrades[idx].count));
                    }
                });
            }

            totalCps = 0;
            clickPower = 1;
            upgrades.forEach(u => { totalCps += u.count * u.cps; clickPower += u.count * u.clickPower; });

            // Offline výdělek (1 % CPS za sekundu, max 24 h)
            if (data.updatedAt && totalCps > 0) {
                const secondsOffline = Math.floor((Date.now() - data.updatedAt) / 1000);
                if (secondsOffline >= 30) {
                    const secs = Math.min(secondsOffline, 86400);
                    const earned = Math.floor(secs * totalCps * 0.01);
                    if (earned > 0) {
                        score += earned;
                        setTimeout(() => {
                            const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
                            let t = (h > 0 ? h + 'h ' : '') + (m > 0 ? m + 'm ' : '') + s + 's';
                            alert('🌙 Vítej zpět!\n\nBěhem tvé nepřítomnosti (' + t + ') ses vydělalo:\n+' + earned.toLocaleString('cs-CZ') + ' ' + config.currency + '!');
                        }, 600);
                    }
                }
            }
            syncGlobalState();
            updateUI();
        };

        ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
            document.addEventListener(ev, (e) => e.preventDefault()));

        document.getElementById('header-emoji').textContent = config.emoji;
        document.getElementById('main-click-btn').textContent = config.emoji;
        document.getElementById('currency-label').textContent = config.currency;

        const scoreUI = document.getElementById('score-val');
        const cpsUI = document.getElementById('cps-val');
        const clicksUI = document.getElementById('clicks-val');
        const shopUI = document.getElementById('shop-list');
        const fmt = (n) => Math.floor(n).toLocaleString('cs-CZ');

        function renderShop() {
            shopUI.innerHTML = '';
            upgrades.forEach((u, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-slate-800 hover:bg-slate-700/80 disabled:opacity-40 disabled:hover:bg-slate-800 p-3.5 rounded-xl border border-slate-700/80 text-left transition flex items-center justify-between group cursor-pointer';
                btn.id = 'upg-btn-' + i;
                btn.onclick = () => buyUpgrade(i);
                const bonus = [];
                if (u.cps > 0) bonus.push('+' + fmt(u.cps) + '/s');
                if (u.clickPower > 0) bonus.push('+' + fmt(u.clickPower) + '/klik');
                btn.innerHTML = '<div><div class="font-bold text-sm text-white group-hover:text-purple-300 transition">' + u.name + '</div>' +
                    '<div class="text-xs text-purple-400 mt-0.5">' + bonus.join(' | ') + '</div></div>' +
                    '<div class="text-right"><div class="font-black text-amber-400 text-sm" id="upg-price-' + i + '">' + fmt(u.currentPrice) + '</div>' +
                    '<div class="text-[10px] text-slate-400">Vlastněno: <span id="upg-count-' + i + '" class="font-bold text-slate-200">0</span></div></div>';
                shopUI.appendChild(btn);
            });
        }

        function updateUI() {
            scoreUI.textContent = fmt(score);
            cpsUI.textContent = '+' + fmt(totalCps) + ' ' + config.currency + '/s';
            clicksUI.textContent = fmt(totalClicks);
            upgrades.forEach((u, i) => {
                const btn = document.getElementById('upg-btn-' + i);
                if (btn) {
                    btn.disabled = score < u.currentPrice;
                    document.getElementById('upg-price-' + i).textContent = fmt(u.currentPrice);
                    document.getElementById('upg-count-' + i).textContent = u.count;
                }
            });
        }

        function buyUpgrade(idx) {
            const u = upgrades[idx];
            if (score >= u.currentPrice) {
                score -= u.currentPrice;
                totalCps += u.cps;
                clickPower += u.clickPower;
                u.count++;
                u.currentPrice = Math.ceil(u.currentPrice * 1.15);
                syncGlobalState();
                updateUI();
            }
        }

        function triggerExplosion(m, particleCount) {
            const banner = document.createElement('div');
            banner.className = 'milestone-banner';
            banner.textContent = m.text;
            banner.style.color = m.color;
            document.body.appendChild(banner);
            setTimeout(() => banner.remove(), 2600);

            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = m.color;
                p.style.boxShadow = '0 0 12px ' + m.color;
                const size = 6 + Math.random() * 16;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                const angle = Math.random() * Math.PI * 2;
                const dist = 120 + Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.8;
                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

        document.getElementById('main-click-btn').addEventListener('click', (e) => {
            score += clickPower;
            totalClicks++;

            const floatEl = document.createElement('div');
            floatEl.className = 'float-text';
            floatEl.textContent = '+' + fmt(clickPower);
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX || (rect.left + rect.width / 2);
            const y = e.clientY || (rect.top + rect.height / 2);
            floatEl.style.left = (x - 15) + 'px';
            floatEl.style.top = (y - 25 + window.scrollY) + 'px';
            document.body.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 800);

            if (totalClicks === 10) triggerExplosion(config.milestone10, 60);
            else if (totalClicks === 100) triggerExplosion(config.milestone100, 160);

            syncGlobalState();
            updateUI();
        });

        setInterval(() => {
            if (totalCps > 0) { score += totalCps; syncGlobalState(); updateUI(); }
        }, 1000);

        renderShop();
        syncGlobalState();
        updateUI();
    </script>
</body>
</html>
