<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden pb-[4.5rem] lg:pb-0">

    <div id="modal" class="hidden fixed inset-0 z-[200] bg-black/70 flex items-end sm:items-center justify-center sm:p-4" onclick="if(event.target===this)closeModal()">

                <button id="save-score-btn" onclick="window.saveGameProgress && window.saveGameProgress(true)" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-3 rounded-lg text-xs uppercase tracking-wider transition active:scale-95">💾 Uložit pozici & skóre</button>

                <button id="logout-btn" onclick="window.googleLogout && window.googleLogout()" class="hidden w-full bg-slate-700 hover:bg-slate-600 text-white py-2 px-3 rounded-lg text-xs transition">Odhlásit</button>
                <button onclick="openModal('recovery')" class="w-full bg-sky-700 hover:bg-sky-600 text-white font-bold py-2 px-3 rounded-lg text-xs transition active:scale-95">🛟 Záchrana & záloha dat</button>

            <div class="card p-4 flex-1 min-h-0 flex flex-col">
                <div class="sec-title"><span>🏆</span> Žebříček <span id="lb-rank" class="ml-auto normal-case tracking-normal font-semibold text-[11px] text-amber-400"></span></div>
                <div class="flex-1 overflow-y-auto pr-1 -mr-1 max-h-[420px] lg:max-h-none">
                    <div id="leaderboard-body" class="space-y-1.5"><div class="py-4 text-center text-xs text-slate-500">Načítám žebříček...</div></div>
                </div>
            </div>
        </section>
    </main>

    <!-- FIREBASE -->
    <script type="module">
        // Firebase se načítá dynamicky: i když se nenačte (výpadek, blokace), zbytek hry a menu funguje.
        const FB = 'https://www.gstatic.com/firebasejs/11.6.1/';
        let fb = {};
        try {
            const mods = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
            fb = Object.assign({}, mods[0], mods[1], mods[2]);
        } catch (e) { console.error('Firebase se nenačetl:', e); }
        const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, linkWithPopup, linkWithRedirect, signInWithRedirect, getRedirectResult, signInWithCredential, signOut,
            getFirestore, collection, doc, setDoc, getDoc, onSnapshot, runTransaction, deleteDoc, increment, query, where, updateDoc, serverTimestamp, getDocFromServer } = fb;

        const firebaseConfig = {
            apiKey: "AIzaSyBlsK8qClnYEyKco0Z2TZ83kuDpSrB4B8g",
            authDomain: "goon-sim.firebaseapp.com",
            projectId: "goon-sim",
            storageBucket: "goon-sim.firebasestorage.app",
            messagingSenderId: "627803499063",
            appId: "1:627803499063:web:b0b19c9da4e837dc10adb2",
            measurementId: "G-9FEPHLHVWB"
        };
        const APP_ID = 'gooning-sim-v1';

        const $ = (id) => document.getElementById(id);
        const setStatus = (t) => { $('status-indicator').textContent = t; };

        let db, auth, currentUser = null, unsubLb = null, loaded = false;

        const lbCol = () => collection(db, 'artifacts', APP_ID, 'public', 'data', 'leaderboard');
        const lbDoc = () => doc(db, 'artifacts', APP_ID, 'public', 'data', 'leaderboard', currentUser.uid);
        const saveDoc = () => doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'saves', 'current');

        const localKey = () => 'goon_game_save_' + (currentUser ? currentUser.uid : 'local');
        function readLocal() {
            try { return JSON.parse(localStorage.getItem(localKey())); } catch (e) { return null; }
        }
        function buildState() {
            return {
                nick: $('player-nick').value.trim() || 'Anonym',
                coins: Math.floor(window.gameScore || 0),
                clicks: window.gameClicks || 0,
                upgrades: window.gameUpgradesState || [],
                limited: window.gameLimited || { owned: {}, slot: 0, slotBought: 0 },
                meta: window.gameMeta || {},
                updatedAt: Date.now()
            };
        }
        function isEmptyState() { return !(window.gameScore > 0) && !(window.gameClicks > 0); }
        let localBestClicks = -1;
        function saveLocal(force) {
            if (isEmptyState() && !force) return;
            try {
                const st = buildState(), bk = 'goon_best_' + (currentUser ? currentUser.uid : 'local');
                localStorage.setItem(localKey(), JSON.stringify(st));
                if (localBestClicks < 0) { try { localBestClicks = (JSON.parse(localStorage.getItem(bk)) || {}).clicks || 0; } catch (e) { localBestClicks = 0; } }
                if ((st.clicks || 0) > localBestClicks) { localBestClicks = st.clicks; localStorage.setItem(bk, JSON.stringify(st)); }  // nejlepší dosažený postup
            } catch (e) {}
        }

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            } catch (err) {
                console.error(err);
                setStatus('⚠️ Pouze lokální paměť');
                useLocalOnly();
                return;
            }

            // Výsledek přesměrování z Google (mobil)
            try {
                await getRedirectResult(auth);
            } catch (err) {
                if (err.code === 'auth/credential-already-in-use' || err.code === 'auth/email-already-in-use') {
                    const cred = GoogleAuthProvider.credentialFromError(err);
                    try { if (cred && confirmSwitch()) await signInWithCredential(auth, cred); } catch (e) { console.error(e); }
                } else {
                    console.error('Redirect chyba:', err);
                }
            }

            // Listener se registruje PŘED přihlášením
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    try { await signInAnonymously(auth); }
                    catch (err) {
                        console.error('Auth chyba:', err);
                        const hint = err.code === 'auth/operation-not-allowed' ? 'Zapni Anonymous v Firebase Auth' :
                                     err.code === 'auth/unauthorized-domain' ? 'Doména není povolená ve Firebase Auth' : err.code;
                        setStatus('⚠️ Přihlášení selhalo: ' + hint);
                        useLocalOnly();
                    }
                    return;
                }
                currentUser = user;
                const isGoogle = !user.isAnonymous;
                setStatus(isGoogle ? '🟢 ' + (user.displayName || user.email || 'Google účet') : '🟢 Cloud aktivní (anonymní účet)');
                $('google-btn').classList.toggle('hidden', isGoogle);
                $('logout-btn').classList.toggle('hidden', !isGoogle);
                listenToLeaderboard();
                await loadCloudProgress();
                startFeatures();
            });
        }

        function useLocalOnly() {
            const local = readLocal();
            if (local && !loaded) window.applyLoadedData(local);
            loaded = true;
            renderLeaderboardUI([], 'Žebříček vyžaduje připojení ke cloudu.');
        }

        function listenToLeaderboard() {
            if (unsubLb) unsubLb();
            unsubLb = onSnapshot(lbCol(), (snap) => {
                const players = [];
                snap.forEach(d => players.push({ id: d.id, ...d.data() }));
                players.sort((a, b) => (b.coins || 0) - (a.coins || 0));
                allPlayers = players;
                renderLeaderboardUI(players.slice(0, 15));
                if (window.onPlayers) window.onPlayers();
            }, (error) => {
                console.error('Žebříček:', error);
                renderLeaderboardUI([], '⚠️ Žebříček nelze načíst (' + error.code + '). Zkontroluj Firestore pravidla.');
            });
        }

// ===== OCHRANA DAT: bezpečné načtení, kontrola konfliktů mezi zařízeními, zálohy =====
        let cloudReady = false, lastWriteAt = 0, bestClicks = 0, bkBestClicks = 0, lastBkHour = -1, lastBestAt = 0, lastCloudCheck = 0, promptOpen = false, saving = false, retryTimer = null;
        const bkDoc = (id) => doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'saves', id);
        const upCount = (d) => (d && Array.isArray(d.upgrades) ? d.upgrades.reduce((a, u) => a + ((u && u.count) || 0), 0) : 0);
        const limCount = (d) => (d && d.limited && d.limited.owned ? Object.keys(d.limited.owned).reduce((a, k) => a + (Number(d.limited.owned[k]) || 0), 0) : 0);
        const fmtN = (n) => (window.abbr ? window.abbr(Number(n) || 0) : String(n));

        async function loadCloudProgress() {
            loaded = false; cloudReady = false;
            let cloud = null, ok = true;
            try {
                const snap = await getDocFromServer(saveDoc());   // vždy ze serveru, ne z paměti prohlížeče
                if (snap.exists()) cloud = snap.data();
            } catch (err) {
                ok = false;
                console.error('Načtení savu:', err);
                setStatus('⚠️ Cloud nedostupný – ukládám jen v tomto zařízení (' + (err.code || '?') + ')');
            }
            // Cloud má přednost. Když není dostupný, zobrazí se lokální data, ale do cloudu se NEZAPISUJE, dokud se nepodaří cloud přečíst.
            const best = ok ? (cloud || readLocal()) : readLocal();
            if (best) window.applyLoadedData(best);
            loaded = true;
            if (ok) await markCloudReady(cloud);
            else if (!retryTimer) retryTimer = setInterval(retryCloud, 15000);
        }
        async function markCloudReady(cloud) {
            lastWriteAt = cloud ? (cloud.updatedAt || 0) : 0;
            bestClicks = Math.max(bestClicks, cloud ? (cloud.clicks || 0) : 0);
            cloudReady = true;
            if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
            const isG = currentUser && !currentUser.isAnonymous;
            setStatus(isG ? '🟢 ' + (currentUser.displayName || currentUser.email || 'Google účet') : '🟢 Cloud aktivní (anonymní účet)');
            try { const bsnap = await getDocFromServer(bkDoc('bk_best')); if (bsnap.exists()) bkBestClicks = bsnap.data().clicks || 0; } catch (e) {}
        }
        async function retryCloud() {
            if (cloudReady || !db || !currentUser || promptOpen) return;
            try {
                const snap = await getDocFromServer(saveDoc());
                const cloud = snap.exists() ? snap.data() : null;
                await reconcile(cloud);
                await markCloudReady(cloud);
            } catch (e) { /* zkusí se znovu za 15 s */ }
        }
        // Pokud je na cloudu výrazně víc postupu než tady (jiné zařízení), zeptá se, než cokoliv přepíše.
        async function reconcile(cloud) {
            if (!cloud) return;
            if ((cloud.updatedAt || 0) !== lastWriteAt && (cloud.clicks || 0) > (window.gameClicks || 0) + 100) {
                promptOpen = true;
                try { await setDoc(bkDoc('bk_prev'), cloud); } catch (e) {}   // jistota: stav z cloudu se uloží do zálohy
                const load = confirm('⚠️ Na cloudu je VÍC postupu než v tomto zařízení.\n\nCloud: ' + fmtN(cloud.coins) + ' coinů, ' + fmtN(cloud.clicks) + ' kliků\nTady: ' + fmtN(window.gameScore) + ' coinů, ' + fmtN(window.gameClicks) + ' kliků\n\nOK = načíst postup z cloudu (doporučeno)\nZrušit = přepsat cloud stavem z tohoto zařízení\n\n(Stav z cloudu se v každém případě uloží do zálohy – 🛟 Záchrana dat.)');
                promptOpen = false;
                if (load) { window.applyLoadedData(cloud, { noOffline: true, replace: true }); saveLocal(true); }
            }
            lastWriteAt = cloud.updatedAt || 0;
        }
        async function writeBackups(st) {
            try {
                const now = Date.now(), hr = Math.floor(now / 3600000);
                if (st.clicks > bkBestClicks && now - lastBestAt > 300000) { lastBestAt = now; await setDoc(bkDoc('bk_best'), st); bkBestClicks = st.clicks; }
                if (hr !== lastBkHour && !(st.clicks < bestClicks - 100)) { lastBkHour = hr; await setDoc(bkDoc('bk_h' + new Date(now).getHours()), st); }   // 24 hodinových záloh
            } catch (e) { console.warn('Záloha:', e.code); }
        }

        window.saveGameProgress = async function (manual, force) {
            if (!loaded || (isEmptyState() && !force)) return;
            saveLocal(force);
            if (!db || !currentUser) return;
            if (!cloudReady) { if (manual) toast('Cloud zatím není dostupný – uloženo jen v tomto zařízení.', 4000); return; }
            if (promptOpen || saving) return;
            saving = true;
            try {
                if (!force && (manual || Date.now() - lastCloudCheck > 45000)) {
                    lastCloudCheck = Date.now();
                    const snap = await getDocFromServer(saveDoc());
                    if (snap.exists()) await reconcile(snap.data());
                }
                const st = buildState();
                await setDoc(saveDoc(), st);          // celý dokument se nahradí (bez slučování), aby se nemíchaly staré a nové položky
                await setDoc(lbDoc(), pubProfile(st), { merge: true });
                lastWriteAt = st.updatedAt;
                writeBackups(st);
                if (manual) {
                    const btn = $('save-score-btn');
                    btn.textContent = '✅ Uloženo do cloudu!';
                    setTimeout(() => btn.textContent = '💾 Uložit pozici & skóre', 2000);
                }
            } catch (err) {
                console.error('Ukládání:', err);
                setStatus('⚠️ Uložení selhalo (' + err.code + ')');
            } finally { saving = false; }
        };

        // ---------- 🛟 ZÁCHRANA DAT ----------
        window.scanBackups = async () => {
            const el = $('rc-list'); if (!el) return;
            el.innerHTML = '<div class="text-xs text-slate-400">Hledám zálohy…</div>';
            const list = [];
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (!k || !/^goon_(game_save|best|pre)(_|$)/.test(k)) continue;
                    try {
                        const d = JSON.parse(localStorage.getItem(k));
                        if (!d || typeof d !== 'object' || !('coins' in d)) continue;
                        const who = k.replace(/^goon_(game_save|best|pre)_?/, '').slice(0, 6) || 'starý formát';
                        list.push({ label: (k.indexOf('goon_best_') === 0 ? 'Toto zařízení – nejlepší postup' : k.indexOf('goon_pre_') === 0 ? 'Toto zařízení – stav před obnovením' : 'Toto zařízení – poslední uložení') + ' (účet ' + who + ')', data: d });
                    } catch (e) {}
                }
            } catch (e) {}
            if (db && currentUser) {
                const ids = [['current', 'Cloud – aktuální stav'], ['bk_best', 'Cloud – nejlepší postup'], ['bk_prev', 'Cloud – stav před přepsáním']].concat(Array.from({ length: 24 }, (_, h) => ['bk_h' + h, 'Cloud – hodinová záloha (' + h + ':00)']));
                const res = await Promise.allSettled(ids.map(i => getDocFromServer(bkDoc(i[0]))));
                res.forEach((r, i) => { if (r.status === 'fulfilled' && r.value.exists()) list.push({ label: ids[i][1], data: r.value.data() }); });
            }
            // odstranit duplicity (stejný stav z více zdrojů) a seřadit: nejvíc postupu nahoře
            const seen = {}, uniq = [];
            list.forEach(it => { const key = [it.data.updatedAt, it.data.coins, it.data.clicks].join('-'); if (seen[key]) seen[key].label += ' = ' + it.label; else { seen[key] = it; uniq.push(it); } });
            uniq.sort((a, b) => (b.data.clicks || 0) - (a.data.clicks || 0) || (b.data.updatedAt || 0) - (a.data.updatedAt || 0));
            window.__rc = uniq;
            el.innerHTML = uniq.length ? uniq.map((it, i) => '<div class="bg-slate-800 rounded-lg px-3 py-2 text-xs"><div class="flex justify-between gap-2 items-start"><b class="break-words">' + (i === 0 ? '⭐ ' : '') + escapeHtml(it.label) + '</b>' +
                '<button onclick="restoreBackup(' + i + ')" class="bg-green-600 hover:bg-green-500 px-2.5 py-1 rounded font-bold shrink-0">Obnovit</button></div>' +
                '<div class="text-slate-400 mt-0.5">' + (it.data.updatedAt ? new Date(it.data.updatedAt).toLocaleString('cs-CZ') : 'neznámý čas') + ' · ' + escapeHtml(it.data.nick || '') + '</div>' +
                '<div class="text-slate-300">💰 ' + fmtN(it.data.coins) + ' · 👆 ' + fmtN(it.data.clicks) + ' · ⬆️ ' + upCount(it.data) + ' upgradů · 🏆 ' + limCount(it.data) + ' limitek</div></div>').join('')
                : '<div class="text-xs text-slate-400">Žádné zálohy nenalezeny. Zkus to na zařízení, kde jsi hrál dřív.</div>';
        };
        async function applyRestore(d) {
            try { localStorage.setItem('goon_pre_' + (currentUser ? currentUser.uid : 'local'), JSON.stringify(buildState())); } catch (e) {}   // aktuální stav se nejdřív schová
            if (db && currentUser && cloudReady) { try { await setDoc(bkDoc('bk_prev'), buildState()); } catch (e) {} }
            window.applyLoadedData(d, { noOffline: true, replace: true });
            bestClicks = Math.max(0, Number(d.clicks) || 0);
            await window.saveGameProgress(true, true);
            toast('✅ Obnoveno: ' + fmtN(d.coins) + ' coinů, ' + fmtN(d.clicks) + ' kliků', 6000);
            if (modalName === 'recovery') openModal('recovery');
        }
        window.restoreBackup = async (i) => {
            const it = (window.__rc || [])[i]; if (!it) return;
            if (!confirm('Obnovit tento stav?\n\n' + it.label + '\n💰 ' + fmtN(it.data.coins) + ' · 👆 ' + fmtN(it.data.clicks) + '\n\nSoučasný stav se předtím uloží do zálohy („stav před obnovením“).')) return;
            await applyRestore(it.data);
        };
        window.exportSave = () => {
            const d = new Date(), blob = new Blob([JSON.stringify({ app: 'gooning-sim', v: 1, exportedAt: d.toISOString(), data: buildState() }, null, 1)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'goon-save-' + d.toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.json';
            document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        };
        window.importSave = (inp) => {
            const f = inp.files && inp.files[0]; if (!f) return;
            if (f.size > 500000) { toast('Soubor je příliš velký.', 3000); inp.value = ''; return; }
            const rd = new FileReader();
            rd.onload = async () => {
                try {
                    const j = JSON.parse(rd.result), d = j && j.data ? j.data : j;
                    if (!d || !isFinite(Number(d.coins)) || !isFinite(Number(d.clicks))) throw new Error('bad');
                    if (!confirm('Nahrát postup ze souboru?\n💰 ' + fmtN(d.coins) + ' · 👆 ' + fmtN(d.clicks) + '\n\nSoučasný stav se předtím uloží do zálohy.')) { inp.value = ''; return; }
                    await applyRestore(d);
                } catch (e) { toast('Soubor se nepodařilo načíst.', 3500); }
                inp.value = '';
            };
            rd.readAsText(f);
        };
        function confirmSwitch() {
            return confirm('Tenhle Google účet už má uložený vlastní postup.\n\nPřepnutím se načte JEHO postup, ne ten z tohoto zařízení (' + fmtN(window.gameScore) + ' coinů, ' + fmtN(window.gameClicks) + ' kliků).\nPostup z tohoto zařízení zůstane uložený v anonymním účtu a půjde vrátit přes 🛟 Záchrana dat (nebo ho předtím exportuj do souboru).\n\nPřepnout na Google účet?');
        }

        let loginBusy = false;
        window.googleLogin = async function () {
            if (!auth || loginBusy) return;
            loginBusy = true;
            const provider = new GoogleAuthProvider();
            try {
                if (auth.currentUser && auth.currentUser.isAnonymous) {
                    // Propojí anonymní účet s Googlem – postup zůstane zachován
                    await linkWithPopup(auth.currentUser, provider);
                    location.reload();
                } else {
                    await signInWithPopup(auth, provider);
                }
            } catch (err) {
                if (err.code === 'auth/credential-already-in-use' || err.code === 'auth/email-already-in-use') {
                    // Google účet už existuje -> přihlásit se do něj bez druhého popupu
                    const cred = GoogleAuthProvider.credentialFromError(err);
                    if (!confirmSwitch()) return;
                    try {
                        await signInWithCredential(auth, cred);
                        location.reload();
                    } catch (e) { alert('Přihlášení selhalo: ' + e.code); }
                } else if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
                    // Mobil: popup je blokovaný -> přesměrování
                    try {
                        await window.saveGameProgress(false);
                        if (auth.currentUser && auth.currentUser.isAnonymous) await linkWithRedirect(auth.currentUser, provider);
                        else await signInWithRedirect(auth, provider);
                    } catch (e) { alert('Přihlášení selhalo: ' + e.code); }
                } else if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                    alert('Přihlášení selhalo: ' + err.code + (err.code === 'auth/unauthorized-domain' ? '\nPřidej doménu do Firebase → Authentication → Settings → Authorized domains.' : ''));
                }
            } finally {
                loginBusy = false;
            }
        };

        window.googleLogout = async function () {
            await window.saveGameProgress(false);
            await signOut(auth);
            location.reload();
        };

        function renderLeaderboardUI(players, msg) {
            const body = $('leaderboard-body'), rk = $('lb-rank');
            if (!players.length) {
                body.innerHTML = '<div class="py-6 text-center text-xs text-slate-500">' + escapeHtml(msg || 'Zatím žádné skóre. Buď první!') + '</div>';
                if (rk) rk.textContent = '';
                return;
            }
            const me = currentUser ? currentUser.uid : null, top = Math.max(1, players[0].coins || 1);
            const dot = (p) => isOnline(p) ? '<span class="inline-block w-1.5 h-1.5 rounded-full bg-green-400 mr-1 align-middle" title="online"></span>' : '';
            const COL = ['#fbbf24', '#cbd5e1', '#d4883a'], MED = ['🥇', '🥈', '🥉'];
            // stupně vítězů (pořadí zobrazení: 2., 1., 3.)
            const pod = (i) => {
                const p = players[i]; if (!p) return '<div></div>';
                const c = COL[i], big = i === 0;
                return '<div data-u="' + p.id + '" onclick="openProfile(this.dataset.u)" class="cursor-pointer rounded-xl text-center px-1.5 ' + (big ? 'pt-3 pb-3' : 'pt-2 pb-2 mt-4') + ' border transition hover:brightness-125 min-w-0" ' +
                    'style="border-color:' + c + '88;background:linear-gradient(180deg,' + c + '2b,transparent)' + (p.id === me ? ';box-shadow:0 0 0 1px ' + c : '') + '">' +
                    '<div class="text-base leading-none">' + MED[i] + '</div><div class="flex justify-center my-1">' + av(p, big ? 44 : 34) + '</div>' +

            if (!active) {
                if (dropState.slot !== null) endDrop();
                timer.textContent = 'další za ' + mmss(start + ms - now);
                return;
            }
            if (dropState.slot !== slot) startDrop(slot);
            timer.textContent = 'zbývá ' + mmss(start + DROP.durationSec * 1000 - now);
            // napojení na globální sklad, jakmile je cloud připravený
            if (dropState.def.stock > 0 && !dropState.unwatch && window.watchDrop) {
                dropState.unwatch = window.watchDrop(slot, (sold) => {
                    dropState.remaining = Math.max(0, dropState.def.stock - sold);
                    refreshDrop();
                });
            }
        }
        setInterval(tickDrop, 1000);
        tickDrop();


        // ===== DOČASNÝ BOOST (z kola štěstí) =====
        // (effCps / effClick používají tmpM())

        // ===== SEX SHOP =====
        // Koupíš za SHOP.price. Zboží se prodává samo (rate ks/s), ale musíš ho dokupovat (unitCost za kus).
        // Tržba z kusu = unitCost × (baseMult + 0.25 × úroveň marže). Ladění: změň čísla níže.
        const SHOP = { price: 1.5e12, unitCost: 2000000, baseCap: 60000, baseRate: 100, baseMult: 3, maxLvl: 12, growth: 2.2, startStock: 10000,
            up: { sl: { name: '📦 Sklad', base: 5e11 }, st: { name: '🧑‍💼 Prodavači', base: 5e11 }, mg: { name: '💹 Marže', base: 8e11 } } };
        const shopS = () => (meta.shop && meta.shop.on ? meta.shop : null);
        const shopCap = (s, l) => Math.floor(SHOP.baseCap * Math.pow(1.5, l === undefined ? s.sl : l));
        const shopRate = (s, l) => SHOP.baseRate * Math.pow(1.3, l === undefined ? s.st : l);
        const shopMult = (s, l) => SHOP.baseMult + 0.25 * (l === undefined ? s.mg : l);
        const shopUpPrice = (k, s) => Math.ceil(SHOP.up[k].base * Math.pow(SHOP.growth, s[k]));
        function shopPerSec(s) {
            const n = Math.min(s.stock, shopRate(s)), inc = n * SHOP.unitCost * shopMult(s) * roleBoost.cps * tmpM();
            return { n: n, inc: inc, profit: inc - n * SHOP.unitCost };
        }
        function shopTick() {
            const s = shopS(); if (!s) return;
            const now = Date.now(); let dt = (now - (s.t || now)) / 1000; s.t = now;
            if (dt <= 0 || !(s.stock > 0)) return;
            dt = Math.min(dt, 86400);
            const n = Math.min(s.stock, shopRate(s) * dt); if (n <= 0) return;
            const rev = n * SHOP.unitCost * shopMult(s) * roleBoost.cps * tmpM();
            s.stock -= n; s.sold = (s.sold || 0) + n; s.earned = (s.earned || 0) + rev; score += rev;
            if (dt > 20) showToast('🏪 Sex shop vydělal ' + abbr(rev) + ' během tvé nepřítomnosti.', 5000, '#15803d');
        }
        function shopAfter() { syncGlobalState(); updateUI(); if (window.saveGameProgress) window.saveGameProgress(false); if (window.openModal) window.openModal('shop'); }
        window.shopBuy = function () {
            if (shopS()) return;
            if (score < SHOP.price) { showToast('Na obchod ti chybí ' + abbr(SHOP.price - score) + '.', 3000); return; }
            score -= SHOP.price;
            meta.shop = { on: 1, stock: SHOP.startStock, sl: 0, st: 0, mg: 0, t: Date.now(), earned: 0, sold: 0 };
            if (window.triggerExplosion) window.triggerExplosion({ text: '🏪 SEX SHOP OTEVŘEN!', color: '#f472b6' }, 120);
            shopAfter();
        };
        window.shopRestock = function (frac) {
            const s = shopS(); if (!s) return;
            shopTick();
            const room = Math.floor(shopCap(s) - s.stock);
            let want = frac >= 1 ? room : Math.min(room, Math.ceil(shopCap(s) * frac));
            const afford = Math.floor(score / SHOP.unitCost);
            const n = Math.min(want, afford);
            if (n <= 0) { showToast(room <= 0 ? 'Sklad je plný.' : 'Nemáš dost coinů na zboží.', 2500); return; }
            score -= n * SHOP.unitCost; s.stock += n; shopAfter();
        };
        window.shopUpgrade = function (k) {
            const s = shopS(); if (!s || !SHOP.up[k]) return;
            if (s[k] >= SHOP.maxLvl) return;
            const p = shopUpPrice(k, s);
            if (score < p) { showToast('Chybí ti ' + abbr(p - score) + '.', 2500); return; }
            shopTick(); score -= p; s[k]++; shopAfter();
        };
        window.shopHTML = function () {
            const s = shopS(), u = SHOP.unitCost;
            const st = (l, v) => '<div class="bg-slate-800 rounded-lg p-2"><div class="text-[10px] text-slate-400">' + l + '</div><div class="text-sm font-bold text-amber-300">' + v + '</div></div>';
            if (!s) {
                return '<div class="text-center"><div class="text-6xl my-2">🏪</div><div class="font-black text-lg mb-1">Vlastní Sex shop</div>' +
                    '<div class="text-xs text-slate-400 mb-3">Koupíš si obchod. Zboží se prodává samo, ale musíš ho <b class="text-slate-200">dokupovat</b> – když sklad dojde, obchod nevydělává. Vylepšuj sklad, prodavače a marži. Vydělává víc než upgrady a tržby se počítají do tvých coinů i žebříčku (🏪 u jména).</div>' +
                    '<div class="grid grid-cols-2 gap-2 mb-3 text-left">' + st('Nákup zboží', abbr(u) + ' / ks') + st('Prodej za', abbr(u * SHOP.baseMult) + ' / ks') + st('Sklad (start)', abbr(SHOP.baseCap) + ' ks') + st('Prodej (start)', SHOP.baseRate + ' ks / s') + '</div>' +
                    '<button onclick="shopBuy()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl active:scale-95 transition">Koupit za ' + abbr(SHOP.price) + '</button>' +
                    (score < SHOP.price ? '<div class="text-[11px] text-red-400 mt-2">Chybí ti ještě ' + abbr(SHOP.price - score) + '</div>' : '') + '</div>';
            }
            const cap = shopCap(s);
            const ups = ['sl', 'st', 'mg'].map(function (k) {
                const l = s[k], max = l >= SHOP.maxLvl, p = shopUpPrice(k, s);
                const eff = k === 'sl' ? 'Sklad ' + abbr(shopCap(s)) + (max ? '' : ' → ' + abbr(shopCap(s, l + 1))) + ' ks'
                    : k === 'st' ? 'Prodej ' + abbr(shopRate(s)) + (max ? '' : ' → ' + abbr(shopRate(s, l + 1))) + ' ks/s'
                    : 'Tržba ' + shopMult(s).toFixed(2).replace('.', ',') + '×' + (max ? '' : ' → ' + shopMult(s, l + 1).toFixed(2).replace('.', ',') + '×') + ' z kusu';
                return '<div class="flex items-center gap-2 bg-slate-800 rounded-xl p-2.5"><div class="flex-1 min-w-0"><div class="text-sm font-bold">' + SHOP.up[k].name + ' <span class="text-[10px] text-slate-400">úr. ' + l + '/' + SHOP.maxLvl + '</span></div><div class="text-[11px] text-purple-300">' + eff + '</div></div>' +
                    (max ? '<div class="text-xs font-black text-green-400">MAX</div>' : '<button onclick="shopUpgrade(\'' + k + '\')" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-black px-3 py-2 rounded-lg active:scale-95">' + abbr(p) + '</button>') + '</div>';
            }).join('');
            return '<div id="shop-live">' +
                '<div class="flex justify-between text-xs mb-1"><span>📦 Sklad</span><span id="shop-stock-txt" class="font-mono font-bold"></span></div><div class="pbar mb-1"><div id="shop-stock-bar" style="width:0"></div></div>' +
                '<div id="shop-warn" class="text-[11px] text-red-400 font-bold mb-1 hidden">⚠️ Došlo zboží! Obchod nevydělává – dokup ho.</div>' +
                '<div class="grid grid-cols-2 gap-2 my-3">' + st('Tržba / s', '<span id="shop-income"></span>') + st('Čistý zisk / s', '<span id="shop-profit"></span>') + st('Celkem vyděláno', '<span id="shop-earned"></span>') + st('Prodáno kusů', '<span id="shop-sold"></span>') + '</div>' +
                '<div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Dokoupit zboží (' + abbr(u) + ' / ks)</div>' +
                '<div class="grid grid-cols-3 gap-2 mb-1"><button onclick="shopRestock(0.1)" class="cbtn bg-sky-600">+10 %</button><button onclick="shopRestock(0.25)" class="cbtn bg-sky-600">+25 %</button><button onclick="shopRestock(1)" class="cbtn bg-green-600">Na plno</button></div>' +
                '<div class="text-[10px] text-slate-500 mb-3">Na plno: <span id="shop-full-cost"></span></div>' +
                '<div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Vylepšení</div><div class="space-y-2">' + ups + '</div></div>';
        };
        window.shopLive = function () {
            const s = shopS(), e = function (id) { return document.getElementById(id); }; if (!s || !e('shop-live')) return;
            const cap = shopCap(s), ps = shopPerSec(s), room = Math.max(0, Math.floor(cap - s.stock));
            e('shop-stock-txt').textContent = abbr(Math.floor(s.stock)) + ' / ' + abbr(cap);
            e('shop-stock-bar').style.width = Math.min(100, s.stock / cap * 100) + '%';
            e('shop-warn').classList.toggle('hidden', s.stock >= 1);
            e('shop-income').textContent = abbr(ps.inc); e('shop-profit').textContent = abbr(ps.profit);
            e('shop-earned').textContent = abbr(s.earned || 0); e('shop-sold').textContent = abbr(Math.floor(s.sold || 0));
            e('shop-full-cost').textContent = abbr(room * SHOP.unitCost) + (score < room * SHOP.unitCost ? ' (máš jen na ' + abbr(Math.floor(score / SHOP.unitCost) * SHOP.unitCost) + ')' : '');
        };

        // ===== SAKURA: okvětní lístky =====
        function petals(on) {
            let el = document.getElementById('petals');
            if (!on) { if (el) el.remove(); return; }
            if (el) return;
            el = document.createElement('div'); el.id = 'petals';
            for (let i = 0; i < 16; i++) {
                const s = document.createElement('span');
                s.textContent = '🌸'; s.style.left = (Math.random() * 100) + '%'; s.style.fontSize = (12 + Math.random() * 14) + 'px';
                s.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
                s.style.animationDuration = (10 + Math.random() * 12).toFixed(1) + 's'; s.style.animationDelay = '-' + (Math.random() * 20).toFixed(1) + 's';
                el.appendChild(s);
            }
            document.body.appendChild(el);
        }
        petals(document.documentElement.dataset.theme === 'sakura-dark');

        renderShop();
        syncGlobalState();
        updateUI();
    </script>
</body>
</html>
